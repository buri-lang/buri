name: macOS toolchain
description: >
  The nightly's macOS toolchain, for the PGO training job and the macOS build:
  rustup installs what rust-toolchain.toml pins, Homebrew provides LLVM 21, and
  CC is clang (cli/build.rs honours CC, and clang is already cc on macOS).

runs:
  using: composite
  steps:
    - shell: bash
      run: rustup toolchain install
    - name: LLVM 21 from Homebrew
      shell: bash
      run: |
        set -euo pipefail
        # The runner image ships taps Homebrew no longer trusts. Removing them is
        # safer than trusting them, and silences the warning. Their formulae go
        # first (nothing here uses them), because untapping a tap with installed
        # formulae warns in its turn. Homebrew hides an untrusted tap's formulae,
        # even from `list` and `uninstall`, so each is trusted just before its removal.
        for tap in aws/tap azure/bicep; do
          brew trust "$tap" || true
          brew list --full-name | grep "^$tap/" \
            | xargs -r brew uninstall --ignore-dependencies || true
          brew untap "$tap" || true
        done
        # The image ships its own LLVM, and installing llvm@21 beside another
        # llvm keg warns that 21 was not linked. Nothing here links: the build
        # reads LLVM_SYS_211_PREFIX. Removing the other kegs leaves exactly one
        # LLVM on the runner, the one llvm-sys 211 expects.
        for keg in $(brew list --formula | grep -E '^llvm(@[0-9]+)?$' | grep -vx 'llvm@21' || true); do
          brew uninstall --ignore-dependencies "$keg"
        done
        brew install llvm@21
        prefix="$(brew --prefix llvm@21)"
        case "$("$prefix/bin/llvm-config" --version)" in
          21.*) ;;
          *) echo "::error::brew llvm@21 is $("$prefix/bin/llvm-config" --version), not 21.x"; exit 1 ;;
        esac
        echo "LLVM_SYS_211_PREFIX=$prefix" >> "$GITHUB_ENV"
        echo "CC=clang" >> "$GITHUB_ENV"
