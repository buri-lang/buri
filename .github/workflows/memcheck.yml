name: Memcheck

# Compiled Buri programs and the native runtime under Valgrind's memcheck, on
# every commit to main and every pull request, the way ci.yml runs
# (design/native/MEMORY.md §8, cli/tests/README.md "Valgrind"). Each distinct
# error becomes one GitHub issue, labelled `planned` and `urgent`.
#
# * **The workload** is the native conformance set built three ways, the
#   backend-agreement and at-scale rows on both native backends, every other
#   `native::` module, and the runtime's unit tests. `BURI_MEMCHECK` makes `cli/tests/native/shared.rs`
#   run each program it built under memcheck; the runtime's tests are one
#   program, run by `cli/examples/valgrind.rs`.
# * **`--features valgrind`** builds a runtime that, under memcheck, takes
#   every block from the system allocator one at a time, annotated where
#   memcheck can't see `malloc` (`cli/runtime/valgrind.rs`).
# * **A test's own failure is its own issue.** Valgrind's errors never change
#   a program's exit status, so a failed test is the test's, and `failed`
#   drafts it from the step's output.
# * **Issues are filed from `main` only.** A run on any other ref prints the
#   issues it would have filed. One run per ref at a time, so two runs on main
#   never file the same signature twice.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per ref: a push that supersedes another cancels it.
concurrency:
  group: memcheck-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  # No silent skip: `cli/tests/harness/ci.rs` panics on one.
  BURI_CI: 1

jobs:
  memcheck:
    name: memcheck (${{ matrix.shard }}, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]
        shard: [stencil-debug, llvm-debug, llvm-release, agreement, e2e, backends, modules, runtime]
        include:
          - { arch: x86_64, os: blacksmith-8vcpu-ubuntu-2404 }
          - { arch: arm64, os: blacksmith-8vcpu-ubuntu-2404-arm }
        # On arm64, LLVM turns some branches into a `csel` keyed on a field
        # that is unset but whose value can't change the answer. Memcheck
        # reports that, about 120 sites (tokio, taffy, tiny-skia, paint). At
        # opt-level 0 they are clean (cli/tests/README.md, "Valgrind").
        exclude:
          - { arch: arm64, shard: runtime }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      BURI_MEMCHECK: ${{ github.workspace }}/target/memcheck
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
        with:
          determinate: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: memcheck-${{ matrix.arch }}
      # The runtime archive `cli/build.rs` builds, which rust-cache drops (see
      # ci.yml's `test` job).
      - uses: actions/cache@v6
        with:
          path: target/debug/build
          key: memcheck-buildscript-${{ matrix.arch }}-${{ hashFiles('flake.lock', 'cli/build.rs', 'cli/runtime/**', 'crates/hash/src/build/sha256.rs', 'crates/stencil/build.rs', 'crates/stencil/src/compiler/backend/stencil/*.rs') }}
          restore-keys: memcheck-buildscript-${{ matrix.arch }}-
      # The agreement rows compare each native answer with JavaScript's.
      - uses: oven-sh/setup-bun@v2
      # `NIX_HARDENING_ENABLE=` everywhere: the C probes some rows link beside a
      # program are compiled by the shell's clang, whose fortify asks musl for
      # `__*_chk`, and a step that changed it would rebuild the runtime.
      - name: Build
        run: |
          nix develop .#perf -c env NIX_HARDENING_ENABLE= cargo test -p buri --features backend-llvm,valgrind --test native --no-run
          nix develop .#perf -c env NIX_HARDENING_ENABLE= cargo build -p buri --features backend-llvm,valgrind --example valgrind
      - name: The conformance set, ${{ matrix.shard }}
        if: startsWith(matrix.shard, 'stencil') || startsWith(matrix.shard, 'llvm')
        env:
          BURI_CONFORMANCE_BUILD: ${{ matrix.shard == 'stencil-debug' && 'stencil' || matrix.shard }}
        run: |
          set -euo pipefail
          mkdir -p "$BURI_MEMCHECK"
          nix develop .#perf -c env NIX_HARDENING_ENABLE= cargo test -p buri --features backend-llvm,valgrind --test native -- conformance::the_native_set_passes \
            2>&1 | tee -a "$BURI_MEMCHECK/tests.log"
      - name: The agreement and at-scale rows
        if: matrix.shard == 'agreement'
        run: |
          set -euo pipefail
          mkdir -p "$BURI_MEMCHECK"
          nix develop .#perf -c env NIX_HARDENING_ENABLE= cargo test -p buri --features backend-llvm,valgrind --test native -- agreement:: at_scale:: \
            2>&1 | tee -a "$BURI_MEMCHECK/tests.log"
      # Every other `native::` module, less `float_parity` and `differential`,
      # which run what they build themselves.
      - name: The other native modules, ${{ matrix.shard }}
        if: matrix.shard == 'e2e' || matrix.shard == 'backends' || matrix.shard == 'modules'
        env:
          FILTERS: ${{ matrix.shard == 'e2e' && 'e2e::' || matrix.shard == 'backends' && 'llvm:: stencil::' || '--skip conformance:: --skip agreement:: --skip at_scale:: --skip e2e:: --skip llvm:: --skip stencil:: --skip float_parity:: --skip differential::' }}
        run: |
          set -euo pipefail
          mkdir -p "$BURI_MEMCHECK"
          nix develop .#perf -c env NIX_HARDENING_ENABLE= cargo test -p buri --features backend-llvm,valgrind --test native -- $FILTERS \
            2>&1 | tee -a "$BURI_MEMCHECK/tests.log"
      - name: The runtime's unit tests
        if: matrix.shard == 'runtime'
        env:
          # Ten thousand parked tasks' stacks are more address space than
          # Valgrind gives a program; a thousand still asks the same question.
          BURI_B9_PARKED: "1000"
        run: |
          set -euo pipefail
          mkdir -p "$BURI_MEMCHECK"
          tests="$(nix develop .#perf -c env NIX_HARDENING_ENABLE= cargo test -p buri-rt-tests --features valgrind --no-run --message-format=json-render-diagnostics \
            | jq -r 'select(.profile.test == true) | .executable | select(. != null)')"
          nix develop .#perf -c target/debug/examples/valgrind tests memcheck "$BURI_MEMCHECK" 'runtime unit tests' "$tests" --test-threads=1 \
            2>&1 | tee -a "$BURI_MEMCHECK/tests.log"
      # A test that failed on its own, apart from any Valgrind error: its own
      # draft issue, and a red step that says so.
      - name: Tests that failed on their own
        if: always()
        run: |
          [ -e "$BURI_MEMCHECK/tests.log" ] || exit 0
          nix develop .#perf -c target/debug/examples/valgrind failed memcheck "$BURI_MEMCHECK" '${{ matrix.shard }}' \
            "$BURI_MEMCHECK/tests.log" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Report
        if: always()
        run: nix develop .#perf -c target/debug/examples/valgrind report "$BURI_MEMCHECK"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: memcheck-${{ matrix.shard }}-${{ matrix.arch }}
          path: target/memcheck
          retention-days: 14
          if-no-files-found: ignore

  # One issue per signature, and none for a signature with an open issue. The
  # only job with write access, and only to issues.
  file:
    needs: memcheck
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions
      - uses: ./.github/actions/file-issues
        with:
          pattern: memcheck-*
