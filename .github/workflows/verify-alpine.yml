name: Verify Alpine LLVM 21

# TEMPORARY, dev-only, STRIP before delivery. Confirm the C++ standard library
# llvm-sys will pull under a fully-static (+crt-static) musl link is available
# as a static archive, and which one Alpine's llvm21 uses — the last unknown
# before the real build, so we don't spend a cold 20-minute rebuild finding out.
on:
  push:
    branches: [nightly-pipeline]
  workflow_dispatch:

jobs:
  probe:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    container: alpine:edge
    timeout-minutes: 10
    steps:
      - name: C++ static + a real static musl C++ link
        run: |
          set -eu
          apk add --no-cache \
            build-base musl-dev clang21 lld \
            llvm21-dev llvm21-static \
            libffi-dev zlib-dev zlib-static zstd-dev zstd-static \
            libxml2-dev libxml2-static ncurses-dev ncurses-static
          echo "=== what does Alpine libLLVM link against (stdc++ vs c++)? ==="
          scanelf -n /usr/lib/llvm21/lib/libLLVM.so* 2>/dev/null || true
          apk info -W /usr/lib/libLLVM* 2>/dev/null | tail -1 || true
          echo "=== C++ static archives present? ==="
          find / -name 'libstdc++.a' 2>/dev/null | head
          find / -name 'libc++.a' 2>/dev/null | head
          find / -name 'libc++abi.a' 2>/dev/null | head
          echo "=== real static musl C++ link test (g++) ==="
          printf '#include <iostream>\nint main(){std::cout<<"hi\\n";return 0;}\n' > t.cpp
          if g++ -static -o t_gpp t.cpp; then
            file t_gpp; ./t_gpp; echo "g++ -static OK"
          else
            echo "g++ -static FAILED"
          fi
          echo "=== does llvm-config say c++ or stdc++ ? ==="
          llvm21-config --cxxflags | tr ' ' '\n' | grep -iE 'c\+\+|stdlib' || true
