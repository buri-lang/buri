name: Verify Alpine LLVM 21

# TEMPORARY, dev-only, STRIP before delivery. Step 1 of the Alpine rework: prove
# an Alpine tag ships an LLVM 21.x dev package before reworking the 20-minute
# Linux build legs. edge is expected to pass; the stable tags are probed for
# information (what LLVM they carry) and allowed to fail.
on:
  push:
    branches: [nightly-pipeline]
  workflow_dispatch:

jobs:
  probe:
    name: probe (${{ matrix.tag }}, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { tag: "edge",   arch: x86_64, os: blacksmith-4vcpu-ubuntu-2404,     required: "true" }
          - { tag: "edge",   arch: arm64,  os: blacksmith-8vcpu-ubuntu-2404-arm, required: "true" }
          - { tag: "3.22",   arch: x86_64, os: blacksmith-4vcpu-ubuntu-2404,     required: "false" }
          - { tag: "3.21",   arch: x86_64, os: blacksmith-4vcpu-ubuntu-2404,     required: "false" }
    runs-on: ${{ matrix.os }}
    container: alpine:${{ matrix.tag }}
    timeout-minutes: 10
    defaults:
      run:
        shell: sh
    steps:
      - name: report + assert LLVM 21.x
        run: |
          set -eu
          echo "=== alpine:${{ matrix.tag }} (${{ matrix.arch }}) ==="
          cat /etc/alpine-release || true
          echo "=== apk search llvm2* / clang21 ==="
          apk update >/dev/null 2>&1 || true
          apk search -e 'llvm2*' || true
          apk search -e 'clang21' || true
          echo "=== attempt install llvm21-dev llvm21-static clang21 ==="
          if ! apk add --no-cache llvm21-dev llvm21-static clang21; then
            echo "::warning::alpine:${{ matrix.tag }} has no installable llvm21-dev"
            if [ "${{ matrix.required }}" = "true" ]; then exit 1; fi
            exit 0
          fi
          # Discover the version. Alpine's llvm21 lives under /usr/lib/llvm21.
          ver=""
          if command -v llvm21-config >/dev/null 2>&1; then
            ver="$(llvm21-config --version)"
            prefix="$(llvm21-config --prefix)"
          elif [ -x /usr/lib/llvm21/bin/llvm-config ]; then
            ver="$(/usr/lib/llvm21/bin/llvm-config --version)"
            prefix="$(/usr/lib/llvm21/bin/llvm-config --prefix)"
          fi
          echo "llvm-config version: ${ver:-<none>}"
          echo "llvm prefix: ${prefix:-<none>}"
          case "$ver" in
            21.*) echo "OK: LLVM $ver on alpine:${{ matrix.tag }} (${{ matrix.arch }})" ;;
            *)
              echo "::error::alpine:${{ matrix.tag }} llvm21 reports '${ver}', not 21.x"
              if [ "${{ matrix.required }}" = "true" ]; then exit 1; fi
              ;;
          esac
