name: CI

# Three things in this file are load-bearing rather than habit, and each of them
# is silent when it is deleted:
#
# * **`CC: clang`** on every job that builds `cli/build.rs`. That script
#   *degrades* rather than fails: the stencil generators pass `--target=<triple>`,
#   `-nostdinc` and `-isystem $(cc -print-resource-dir)`, and the C they generate
#   uses `musttail`. gcc understands none of it, so an EMPTY stencil library and
#   an EMPTY runtime archive are written, every `if !supported()` guard in the
#   suite fires, and the run is green having checked nothing. On macOS `clang` is
#   what `cc` already is, so the macOS leg pays nothing for it.
#
# * **`rustup target add <arch>-unknown-linux-musl`**, before the first cargo
#   build on Linux. `cli/build.rs` asks `rustc --print target-libdir` for the musl
#   `self-contained/` directory, and it exists only when that `rust-std` is
#   installed. Missing, the runtime archive is built against glibc and the baked
#   sysroot is empty — so every artifact this compiler links stops running on any
#   Linux but the runner's, which is a break no test running *here* can observe.
#   `musl-dev` supplies the C headers that go with it and `musl-tools` the
#   `musl-gcc` driver `build/link.rs` falls back to.
#
# * **`BURI_CI: 1`**, workflow-level, which is the definition of "every job".
#   `cli/tests/harness/ci.rs` turns every `if !supported() { return; }` into a
#   PANIC when it is set, so a degraded toolchain fails loudly instead of
#   reporting a vacuous green.
#
# There are no shell scripts here on purpose. The assertions that used to live in
# `.github/scripts/` — the stencil libraries and the runtime archive are real
# bytes, the tools are on `PATH`, a linked Linux artifact is a static PIE with a
# non-executable stack, the published crate carries the runtime — are tests in
# `cli/tests/ci.rs`, so they run on a contributor's machine too and a runner is
# just a host that has the tools.
#
# `push` on main plus `pull_request` is what covers a fork's pull request, whose
# branch pushes nothing here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per ref: a push that supersedes another cancels it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Line tables, not the whole of DWARF: `RUST_BACKTRACE` wants frame names and
  # file:line and nothing here runs a debugger. Seventeen per cent of the CPU of
  # a test build, and CPU is what a four-core runner is short of.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  # NEVER SKIP A TEST ON CI. `cli/tests/harness/ci.rs::skipped` panics when this
  # is set; `cli/tests/ci.rs` asserts this line is still here.
  BURI_CI: 1

jobs:
  # The whole suite, on every host this toolchain supports. Compiled programs are
  # executed with `bun`, and the constant-stack tail-call tests additionally run
  # under `node`, because JavaScriptCore has proper tail calls and V8 does not.
  test:
    name: test (${{ matrix.arch }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: blacksmith-12vcpu-macos-latest, arch: arm64 }
          - { os: blacksmith-4vcpu-ubuntu-2404, arch: x86_64 }
          - { os: blacksmith-4vcpu-ubuntu-2404-arm, arch: arm64 }
    runs-on: ${{ matrix.os }}
    env:
      CC: clang
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Two architectures must not share a key: the artifacts are the host's.
          shared-key: ${{ matrix.os }}-${{ matrix.arch }}
      - uses: oven-sh/setup-bun@v2
      - if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld mold llvm binutils musl-dev musl-tools
          # Debian puts the UNVERSIONED llvm tool names under /usr/lib/llvm-<N>/bin.
          # `cli/tests/native/stencil.rs::cross_tools` probes those names.
          ls -d /usr/lib/llvm-*/bin | sort -V | tail -1 >> "$GITHUB_PATH"
          rustup target add "$(uname -m)-unknown-linux-musl"
      # `cli/build.rs`'s own output, which `Swatinem/rust-cache` deliberately
      # drops: it cleans the workspace's artifacts before saving, and `OUT_DIR`
      # holds a fat-LTO release build of the runtime's dependency tree. A wrong
      # key costs a rebuild and can never produce a stale archive, because the
      # restored directory is an input to cargo's own fingerprints.
      - uses: useblacksmith/cache@v5
        with:
          path: target/debug/build
          key: buildscript-${{ matrix.os }}-${{ matrix.arch }}-${{ hashFiles('cli/build.rs', 'cli/runtime/**', 'cli/src/build/sha256.rs', 'cli/src/compiler/backend/stencil/*.rs') }}
          restore-keys: buildscript-${{ matrix.os }}-${{ matrix.arch }}-
      # `--no-fail-fast`: one failing domain must not hide the other fourteen.
      - run: cargo test -p buri --no-fail-fast
      # The other member of the workspace: `website` depends on `buri` by path,
      # so it links the rlib the step above already built and costs seconds.
      - run: cargo test -p website
      # The runtime's other feature, on one job of the whole workflow. `net-h3`
      # is off by default (`cli/runtime/manifest.toml` argues why); what has to
      # stay true is that it compiles, that the archive stays inside the same
      # size budget, and that the toolchain agrees with it across the C ABI.
      # LAST, because it rewrites the archive and relinks `buri`.
      - if: matrix.arch == 'x86_64'
        name: The runtime also builds with net-h3
        env:
          BURI_RUNTIME_NET_H3: "1"
        run: |
          cargo test -p buri --test ci the_runtime_archive_is_real
          cargo test -p buri --test native runtime::the_networking_features_agree_across_the_abi
      # A failing test's scratch tree is its evidence (cli/tests/README.md). A
      # panicking test keeps its own; `BURI_KEEP` is not set, because it would
      # also keep every passing suite's and that is the 14 GB that filled a disk.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scratch-${{ matrix.os }}-${{ matrix.arch }}
          path: target/tmp
          retention-days: 7
          if-no-files-found: ignore

  # Both architectures, because `cfg(target_arch)` is real in the stencil backend
  # and a lint that fires on one and not the other is what a single-arch job stops
  # seeing. Deliberately not `-D warnings`: every lint this repository states is
  # `deny` in the workspace manifest, so a violation already fails this step, and
  # turning the rest into errors would make CI's verdict depend on clippy's
  # version rather than on the repository's rules.
  clippy:
    name: clippy (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: blacksmith-4vcpu-ubuntu-2404, arch: x86_64 }
          - { os: blacksmith-4vcpu-ubuntu-2404-arm, arch: arm64 }
    runs-on: ${{ matrix.os }}
    env:
      CC: clang
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os }}-${{ matrix.arch }}-clippy
      - run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang musl-dev musl-tools
          rustup target add "$(uname -m)-unknown-linux-musl"
      - run: cargo clippy -p buri -p website --all-targets

  # The validation gate: compile every corpus and measure nothing. `--profile
  # validate` is the point of the job — the root `Cargo.toml` declares it, and it
  # keeps `opt-level = 3` while dropping the fat LTO and the single codegen unit
  # that `[profile.bench]` would spend on a boolean about whether a corpus
  # compiles.
  validate:
    name: validation gate (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: blacksmith-4vcpu-ubuntu-2404, arch: x86_64 }
          - { os: blacksmith-4vcpu-ubuntu-2404-arm, arch: arm64 }
    runs-on: ${{ matrix.os }}
    env:
      CC: clang
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os }}-${{ matrix.arch }}-validate
      - run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang musl-dev musl-tools
          rustup target add "$(uname -m)-unknown-linux-musl"
      - run: cargo bench -p buri --bench compiler --profile validate -- --validate --quick

  # The release backend, x86-64 only and ADVISORY: LLVM 21 is not in Ubuntu 24.04,
  # so this job depends on apt.llvm.org, and a red X caused by a 404 teaches
  # people to ignore a red X. The agreement test (ARCHITECTURE.md §4) is what
  # makes the release code generator worth turning on, and it exists only with
  # both backends built.
  release:
    name: release build (x86_64, advisory)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      CC: clang
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu-2404-x86_64-release
      - uses: oven-sh/setup-bun@v2
      - run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld mold llvm binutils musl-dev musl-tools
          ls -d /usr/lib/llvm-*/bin | sort -V | tail -1 >> "$GITHUB_PATH"
          rustup target add "$(uname -m)-unknown-linux-musl"
      # CODEGEN-LLVM.md §8.1 allows exactly one supported LLVM, so the version is
      # asserted rather than assumed: a silently substituted 22 is what a compiler
      # claiming byte-identical output must not accept.
      - name: LLVM 21 from apt.llvm.org
        run: |
          set -euo pipefail
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          codename=$(lsb_release -cs)
          echo "deb http://apt.llvm.org/$codename/ llvm-toolchain-$codename-21 main" \
            | sudo tee /etc/apt/sources.list.d/llvm21.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            llvm-21-dev libpolly-21-dev libzstd-dev zlib1g-dev
          case "$(llvm-config-21 --version)" in
            21.*) ;;
            *) echo "::error::apt.llvm.org served $(llvm-config-21 --version), not 21.x"; exit 1 ;;
          esac
          echo "LLVM_SYS_211_PREFIX=$(llvm-config-21 --prefix)" >> "$GITHUB_ENV"
      - run: cargo test -p buri --features backend-llvm --no-fail-fast

  # The language server's 50 ms bar. `cli/tests/build/repositories.rs`'s two
  # `BURI_PERF` tests are the only opt-in tests in the suite: they assert
  # milliseconds, so a debug build fails them on the profile rather than on the
  # change. arm64, because the bar was calibrated on an M-series mac. No `CC` and
  # no apt: this job drives `buri lsp` over a pipe and links nothing.
  language-server-budget:
    name: language server budget (arm64)
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    env:
      BURI_PERF: 1
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu-2404-arm-release
      # One thread: two language servers on one runner would be timing each
      # other's contention. `--nocapture` because both tests print their slowest
      # requests on a pass, and this log is where the next recalibration reads them.
      - run: |
          cargo test --release -p buri --test build repositories::language_server_ \
            -- --nocapture --test-threads=1

  # `cargo install buri` on a machine with nothing installed on it.
  # `--no-default-features` is the dependency-free build `cli/Cargo.toml`'s bar is
  # about, and this runner is deliberately the one with no clang and no musl.
  minimal:
    timeout-minutes: 30
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p buri --no-default-features

  # The formal development: the build must succeed, the audit must record no
  # sorryAx, and no proof may contain `sorry`/`admit`.
  lean:
    timeout-minutes: 30
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: useblacksmith/cache@v5
        with:
          path: formal/.lake
          key: lake-${{ runner.os }}-${{ hashFiles('formal/lean-toolchain', 'formal/lakefile.toml') }}
      - working-directory: formal
        run: |
          lake build
          lake env lean Audit.lean | tee audit.out
          ! grep -q sorryAx audit.out
          ! grep -rn 'sorry\|admit' Buri/

  # The editor grammars: the generated grammar compiles, every highlight query
  # compiles, and the tree-sitter parse of every test source agrees with the
  # compiler's own verdict. `check.sh` is the grammar directory's own test runner
  # — a contributor runs it by hand — and not CI machinery, which is why it is the
  # one script this workflow still calls.
  tree-sitter:
    timeout-minutes: 30
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm install -g tree-sitter-cli
      - run: cargo build -p buri --example parse_verdicts
      - run: ./check.sh
        working-directory: editors/tree-sitter-buri
      - run: ./check.sh
        working-directory: editors/tree-sitter-buri-build

  # Packaging: the flake evaluates and the package builds, which is the
  # `nix run github:...` path users take. The derivation carries its own
  # runtime-archive assertion in `postBuild`, because the sandbox is the only
  # place that archive exists. No binary cache action: measured, its post step
  # cost five minutes to upload a store path no later run can hit.
  nix:
    timeout-minutes: 30
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - run: nix flake check --all-systems
      - run: nix build .#default
      - run: ./result/bin/buri version
