name: CI

# Three things in this file are load-bearing rather than habit, and each of them
# is silent when it is deleted:
#
# * **`CC: clang`** on every job that builds `cli/build.rs`. That script
#   *degrades* rather than fails: the stencil generators pass `--target=<triple>`,
#   `-nostdinc` and `-isystem $(cc -print-resource-dir)`, and the C they generate
#   uses `musttail`. gcc understands none of it, so an EMPTY stencil library and
#   an EMPTY runtime archive are written, every `if !supported()` guard in the
#   suite fires, and the run is green having checked nothing. On macOS `clang` is
#   what `cc` already is, so the macOS leg pays nothing for it.
#
# * **`rustup toolchain install`**, before the first cargo build. It installs
#   what `rust-toolchain.toml` pins, the same rustc `nix develop` has.
#
# * **`rustup target add <arch>-unknown-linux-musl`**, on every Linux job with
#   `CC: clang`. `cli/build.rs` asks `rustc --print target-libdir` for the musl
#   `self-contained/` directory, and it exists only when that `rust-std` is
#   installed. Missing, the runtime archive is built against glibc and the baked
#   sysroot is empty — so every artifact this compiler links stops running on any
#   Linux but the runner's, which is a break no test running *here* can observe.
#   `musl-dev` supplies the C headers that go with it and `musl-tools` the
#   `musl-gcc` driver `build/link.rs` falls back to. The jobs without clang
#   don't add it: given a musl std, `ring` needs a C compiler that targets musl.
#
# * **`BURI_CI: 1`**, workflow-level, which is the definition of "every job".
#   `cli/tests/harness/ci.rs` turns every `if !supported() { return; }` into a
#   PANIC when it is set, so a degraded toolchain fails loudly instead of
#   reporting a vacuous green.
#
# There are no shell scripts here on purpose. The assertions that used to live in
# `.github/scripts/` — the stencil libraries and the runtime archive are real
# bytes, the tools are on `PATH`, a linked Linux artifact is a static PIE with a
# non-executable stack, the published crate carries the runtime — are tests in
# `cli/tests/ci.rs`, so they run on a contributor's machine too and a runner is
# just a host that has the tools.
#
# `push` on main plus `pull_request` is what covers a fork's pull request, whose
# branch pushes nothing here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per ref: a push that supersedes another cancels it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Line tables, not the whole of DWARF: `RUST_BACKTRACE` wants frame names and
  # file:line and nothing here runs a debugger. Seventeen per cent of the CPU of
  # a test build, and CPU is what a four-core runner is short of.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  # NEVER SKIP A TEST ON CI. `cli/tests/harness/ci.rs::skipped` panics when this
  # is set; `cli/tests/ci.rs` asserts this line is still here.
  BURI_CI: 1

jobs:
  # The whole suite, on every host this toolchain supports. Compiled programs are
  # executed with `bun`, and the constant-stack tail-call tests additionally run
  # under `node`, because JavaScriptCore has proper tail calls and V8 does not.
  test:
    name: test (${{ matrix.arch }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: blacksmith-12vcpu-macos-latest, arch: arm64 }
          - { os: blacksmith-4vcpu-ubuntu-2404, arch: x86_64 }
          # Eight cores, not four: this leg's cores are 2.6x slower than the
          # x86_64 runner's (measured on run 34121595426, uniformly across every
          # binary), and the suite is started 2x nproc wide, so the leg's wall
          # clock is the four-core queue. Measured at four: 23 minutes; the
          # other two legs finish in six and eleven.
          - { os: blacksmith-8vcpu-ubuntu-2404-arm, arch: arm64 }
    runs-on: ${{ matrix.os }}
    env:
      CC: clang
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          # Two architectures must not share a key: the artifacts are the host's.
          shared-key: ${{ matrix.os }}-${{ matrix.arch }}
      - uses: oven-sh/setup-bun@v2
      # A macOS host cross-builds the Linux output in the output-selection and
      # cross tests (#194), which needs the Linux target's standard library.
      - if: runner.os == 'macOS'
        run: rustup target add x86_64-unknown-linux-musl
      - if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld mold llvm binutils musl-dev musl-tools
          # Debian puts the UNVERSIONED llvm tool names under /usr/lib/llvm-<N>/bin.
          # `cli/tests/native/stencil.rs::cross_tools` probes those names.
          ls -d /usr/lib/llvm-*/bin | sort -V | tail -1 >> "$GITHUB_PATH"
          rustup target add "$(uname -m)-unknown-linux-musl"
      # `cli/build.rs`'s own output, which `Swatinem/rust-cache` deliberately
      # drops: it cleans the workspace's artifacts before saving, and `OUT_DIR`
      # holds a fat-LTO release build of the runtime's dependency tree. A wrong
      # key costs a rebuild and can never produce a stale archive, because the
      # restored directory is an input to cargo's own fingerprints.
      - uses: actions/cache@v6
        with:
          path: target/debug/build
          key: buildscript-${{ matrix.os }}-${{ matrix.arch }}-${{ hashFiles('cli/build.rs', 'cli/runtime/**', 'crates/hash/src/build/sha256.rs', 'crates/stencil/build.rs', 'crates/stencil/src/compiler/backend/stencil/*.rs') }}
          restore-keys: buildscript-${{ matrix.os }}-${{ matrix.arch }}-
      # **The suite, with its binaries overlapped**, because `cargo test` runs
      # them ONE AT A TIME and on a four-core runner that is the whole of this
      # job's wall clock. Measured on the arm64 leg of run 33981313436: the step
      # was 424 s, of which 145 s was compiling and 280 s was running — fifteen
      # libtest binaries in a queue, the longest 54.5 s, no two ever overlapping,
      # on a box with four cores that were idle for most of it. These suites wait
      # on `cc`, on a linker and on a child process rather than on a core.
      #
      # So the build is asked for on its own and the binaries it produced are
      # started together: TWICE `nproc` of them at a time, two test threads each.
      #
      # Both halves of that are measured rather than tidy. Two threads because a
      # core with one runnable thread on it idles through exactly the stalls
      # being hidden. Twice the core count of WORKERS because of the ORDER cargo
      # emits its artifacts in: `native` (78 s, the longest unit by a factor of
      # two) is fourteenth of fifteen and `language` is fifteenth, so at four
      # workers the longest unit does not start until the other thirteen have
      # been dealt out, and it alone then holds the run open. At eight, every
      # unit is started inside the first few seconds and the wall clock is the
      # longest unit rather than the queue in front of it. Sorting the list would
      # be the other fix and is not taken: neither binary size nor test count
      # predicts a unit's runtime here — the largest binary takes 6 s and the
      # smallest takes 26 — so any order worth having would be a hand-written
      # list of domain names, which is the thing this step must not contain.
      #
      # Sixteen concurrent tests on a four-core leg is not a new number: the
      # macOS leg already runs `--test-threads=12` inside every binary. Peak
      # concurrency also lands in the first seconds, while the short units are
      # the ones running; by the time the compiler-spawning suites are alone,
      # concurrency has fallen to them.
      #
      # **One unit is named, and only to schedule it.** `language` is the longest
      # unit on every leg, by far. Run 35149058204 measured it at 1309 s on
      # arm64 (next longest: `native`, 711 s), 829 s on x86_64 (`build`, 669 s)
      # and 347 s on macOS (`build`, 148 s). Its long tests are serial loops over
      # a corpus, so at two threads they queue two at a time. For the last ten
      # minutes of the arm64 leg, those two threads were all that was running
      # on an eight-core box. The x86_64 leg also queued it: fifteenth of
      # fifteen on eight workers, it started about 137 s after the others. So it
      # starts first, outside the queue, with one test thread per core. That is
      # libtest's own default, and it is the width the x86_64 `release` job
      # gives it, where it takes 496 s. Naming it does not make this a list. The
      # set is still cargo's, and the name only orders one member of it. If the
      # unit is renamed, the `grep` finds nothing and the step fails rather
      # than running without it.
      #
      # **The set is cargo's, never a list.** Every artifact whose PROFILE says
      # `test` is run — the profile's flag and not the target's, because cargo
      # marks the plain `buri` binary testable too and running that one is the
      # CLI with `--test-threads` as its subcommand. It is by construction the
      # set `cargo test -p buri` would have run, so a domain added under
      # `cli/tests/` tomorrow runs on the day it is added.
      # `cli/tests/ci.rs::the_suite_is_asked_for_as_a_whole` holds that, and
      # holds this to being a derivation rather than a list. `buri-rt-tests` is
      # the runtime's unit tests (`runtime-tests`).
      #
      # Every unit runs whatever happens — this is `--no-fail-fast` by
      # construction, since `xargs` starts what is queued regardless — and each
      # writes its own log, so a failure's report is not four processes
      # interleaved. The doctests are the one unit cargo cannot hand over as an
      # executable; there are none today, and that line is what stops the first
      # one written from being silently dropped.
      #
      # **A hung unit fails the step, and its log is still printed.** The logs
      # are only tailed once every unit has exited, so a unit that never exits
      # used to leave nothing but the job's 40-minute cancel (run 37188532971,
      # a runtime test deadlocked in `buri_rt`). The step's own bound stops it
      # first, and the step after it prints the logs the tail never reached.
      # libtest writes "has been running for over 60 seconds" into the hung
      # unit's log, which names the test.
      - name: The suite, with its binaries overlapped
        timeout-minutes: 25
        run: |
          set -euo pipefail
          mkdir -p target/units
          cargo test -p buri-rt-tests -p buri -p buri-hash -p buri-stdlib -p buri-docs -p buri-diagnostics -p buri-syntax -p buri-project -p buri-semantics -p buri-middle -p buri-backend -p buri-js -p buri-stencil -p buri-stdlib-coverage -p buri-coverage --no-run --message-format=json-render-diagnostics \
            | jq -r 'select(.profile.test == true) | .executable | select(. != null)' > target/units.txt
          test -s target/units.txt
          slowest="$(grep -E '/language-[0-9a-f]+$' target/units.txt)"
          status=0
          "$slowest" --test-threads="$(getconf _NPROCESSORS_ONLN)" \
            > "target/units/$(basename "$slowest").log" 2>&1 &
          first=$!
          grep -vxF -- "$slowest" target/units.txt \
            | xargs -P "$(( $(getconf _NPROCESSORS_ONLN) * 2 ))" -n 1 \
              sh -c 'exec "$0" --test-threads=2 > "target/units/$(basename "$0").log" 2>&1' \
            || status=$?
          wait "$first" || status=$?
          tail -n +1 -- target/units/*.log
          touch target/units.printed
          cargo test -p buri --doc
          exit "$status"
      - if: failure()
        name: The units' logs, when the suite was stopped
        run: test -e target/units.printed || tail -n +1 -- target/units/*.log
      # The tests that drive the runtime directly, once more under the heap
      # check: the runtime's unit tests, and the C drivers in `native::runtime`
      # and `native::float_parity`. Compiled programs are checked in every run
      # already (`harness::HEAP_CHECK`); these call the runtime themselves, so
      # nothing checked them until the variable was set here. The binaries are
      # the ones the step above built, and the run takes about 30 s, so a hang
      # here is stopped at 10 minutes rather than at the job's 40.
      - name: The runtime, under the heap check
        timeout-minutes: 10
        env:
          BURI_RT_HEAP_CHECK: "1"
        run: |
          cargo test -p buri-rt-tests
          cargo test -p buri --test native -- runtime:: float_parity::
      # The last member of the workspace: `website` depends on `buri` by path,
      # so it links the rlib the step above already built and costs seconds.
      - run: cargo test -p website
      # The runtime's other feature, on one job of the whole workflow. `net-h3`
      # is off by default (`cli/runtime/manifest.toml` argues why); what has to
      # stay true is that it compiles, that the archive stays inside the same
      # size budget, and that the toolchain agrees with it across the C ABI.
      # LAST, because it rewrites the archive and relinks `buri`.
      - if: matrix.arch == 'x86_64'
        name: The runtime also builds with net-h3
        env:
          BURI_RUNTIME_NET_H3: "1"
        run: |
          cargo test -p buri --test ci the_runtime_archive_is_real
          cargo test -p buri --test native runtime::the_networking_features_agree_across_the_abi
      # A failing test's scratch tree is its evidence (cli/tests/README.md). A
      # panicking test keeps its own; `BURI_KEEP` is not set, because it would
      # also keep every passing suite's and that is the 14 GB that filled a disk.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: scratch-${{ matrix.os }}-${{ matrix.arch }}
          path: target/tmp
          retention-days: 7
          if-no-files-found: ignore

  # Both architectures, because `cfg(target_arch)` is real in the stencil backend
  # and a lint that fires on one and not the other is what a single-arch job stops
  # seeing. Deliberately not `-D warnings`: every lint this repository states is
  # `deny` in the workspace manifest, so a violation already fails this step, and
  # turning the rest into errors would make CI's verdict depend on clippy's
  # version rather than on the repository's rules.
  clippy:
    name: clippy (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: blacksmith-4vcpu-ubuntu-2404, arch: x86_64 }
          - { os: blacksmith-4vcpu-ubuntu-2404-arm, arch: arm64 }
    runs-on: ${{ matrix.os }}
    env:
      CC: clang
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os }}-${{ matrix.arch }}-clippy
      - run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang musl-dev musl-tools
          rustup target add "$(uname -m)-unknown-linux-musl"
      - run: cargo clippy --workspace --exclude buri-llvm --all-targets

  # The validation gate: compile every corpus and measure nothing. `--profile
  # validate` is the point of the job — the root `Cargo.toml` declares it, and it
  # keeps `opt-level = 3` while dropping the fat LTO and the single codegen unit
  # that `[profile.bench]` would spend on a boolean about whether a corpus
  # compiles.
  validate:
    name: validation gate (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: blacksmith-4vcpu-ubuntu-2404, arch: x86_64 }
          - { os: blacksmith-4vcpu-ubuntu-2404-arm, arch: arm64 }
    runs-on: ${{ matrix.os }}
    env:
      CC: clang
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os }}-${{ matrix.arch }}-validate
      - run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang musl-dev musl-tools
          rustup target add "$(uname -m)-unknown-linux-musl"
      - run: cargo bench -p buri --bench compiler --profile validate -- --validate --quick

  # The throughput goals, counted (design/PERFORMANCE.md §6.82): instructions a
  # line per phase against the budget each goal sets. Cachegrind's counts are
  # exact, so this blocks. arm64, because the budgets come from an Apple core's
  # instruction rate, and an arm64 count is what that core retires.
  # It runs in the flake's `perf` shell, as `instructions` does, which pins
  # rustc, clang, glibc and valgrind.
  goals-counted:
    name: throughput goals, counted (arm64)
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
        with:
          determinate: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu-2404-arm-goals
      # The runtime archive `cli/build.rs` builds, which rust-cache drops (see
      # the `test` job).
      - uses: actions/cache@v6
        with:
          path: target/release/build
          key: goals-buildscript-${{ hashFiles('flake.lock', 'cli/build.rs', 'cli/runtime/**', 'crates/hash/src/build/sha256.rs', 'crates/stencil/build.rs', 'crates/stencil/src/compiler/backend/stencil/*.rs') }}
          restore-keys: goals-buildscript-
      # The corpora on disk. A stale copy can't be used: the gate checks each
      # against its pinned digest and writes it again on a mismatch.
      - uses: actions/cache@v6
        with:
          path: target/goals
          key: goals-corpora-${{ runner.os }}-${{ hashFiles('cli/benches/pinned/mixed-1M.txt', 'cli/benches/pinned/mixed-100k.txt') }}
      - run: nix develop .#perf -c cargo bench -p buri --bench compiler -- --goals=count

  # The throughput goals, timed: lines a second on a machine like a developer's,
  # failing only below a goal itself. Parse only warns, because it has under
  # 1.2x headroom and noise could fail it; check and dev compile have over 3x.
  goals-timed:
    name: throughput goals, timed (macOS)
    runs-on: blacksmith-12vcpu-macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-goals
      - uses: actions/cache@v6
        with:
          path: target/goals
          key: goals-corpora-${{ runner.os }}-${{ hashFiles('cli/benches/pinned/mixed-1M.txt', 'cli/benches/pinned/mixed-100k.txt') }}
      - run: cargo bench -p buri --bench compiler -- --goals=wall

  # The release backend, x86-64 only and ADVISORY: LLVM 21 is not in Ubuntu 24.04,
  # so this job depends on apt.llvm.org, and a red X caused by a 404 teaches
  # people to ignore a red X. The agreement test (ARCHITECTURE.md §4) is what
  # makes the release code generator worth turning on, and it exists only with
  # both backends built.
  release:
    name: release build (x86_64, advisory)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      CC: clang
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu-2404-x86_64-release
      - uses: oven-sh/setup-bun@v2
      - run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld mold llvm binutils musl-dev musl-tools
          ls -d /usr/lib/llvm-*/bin | sort -V | tail -1 >> "$GITHUB_PATH"
          rustup target add "$(uname -m)-unknown-linux-musl"
      # CODEGEN-LLVM.md §8.1 allows exactly one supported LLVM, so the version is
      # asserted rather than assumed: a silently substituted 22 is what a compiler
      # claiming byte-identical output must not accept.
      - name: LLVM 21 from apt.llvm.org
        run: |
          set -euo pipefail
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          codename=$(lsb_release -cs)
          echo "deb http://apt.llvm.org/$codename/ llvm-toolchain-$codename-21 main" \
            | sudo tee /etc/apt/sources.list.d/llvm21.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            llvm-21-dev libpolly-21-dev libzstd-dev zlib1g-dev
          case "$(llvm-config-21 --version)" in
            21.*) ;;
            *) echo "::error::apt.llvm.org served $(llvm-config-21 --version), not 21.x"; exit 1 ;;
          esac
          echo "LLVM_SYS_211_PREFIX=$(llvm-config-21 --prefix)" >> "$GITHUB_ENV"
      - run: cargo test -p buri -p buri-llvm --features buri/backend-llvm --no-fail-fast

  # The language server's 50 ms bar, and the bars on a whole-repository
  # `buri test //...`. `cli/tests/build/repositories.rs`'s three `BURI_PERF`
  # tests are the only opt-in tests in the suite: they assert time, so a debug
  # build fails them on the profile rather than on the change. arm64, because
  # the bars were calibrated on an M-series mac. No `CC` and no apt: this job
  # drives `buri lsp` over a pipe and tests JavaScript suites, and links nothing.
  language-server-budget:
    name: language server budget (arm64)
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    env:
      BURI_PERF: 1
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu-2404-arm-release
      # The repository budget's suites run on JavaScript.
      - uses: oven-sh/setup-bun@v2
      # One thread: two measured sessions on one runner would be timing each
      # other's contention. `--nocapture` because every test prints its timings
      # on a pass, and this log is where the next recalibration reads them.
      - run: |
          cargo test --release -p buri --test build -- \
            repositories::language_server_ repositories::monorepo_test_budget \
            --nocapture --test-threads=1

  # The instruction-count gate (design/PERFORMANCE.md §9): fixed workloads,
  # counted by cachegrind, against `cli/benches/instructions/baseline.txt`.
  # Counts are exact where a timer is noise, so this blocks. It runs in the
  # flake's `perf` shell, which pins rustc, LLVM, clang, glibc and valgrind to
  # `flake.lock`. x86_64 only: valgrind's amd64 port shows every runner the same
  # CPU, so a count doesn't depend on which machine ran it.
  instructions:
    name: instruction counts (x86_64)
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
        with:
          determinate: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu-2404-x86_64-instructions
      # The runtime archive `cli/build.rs` builds, which rust-cache drops (see
      # the `test` job).
      - uses: actions/cache@v6
        with:
          path: target/release/build
          key: instructions-buildscript-${{ hashFiles('flake.lock', 'cli/build.rs', 'cli/runtime/**', 'crates/hash/src/build/sha256.rs', 'crates/stencil/build.rs', 'crates/stencil/src/compiler/backend/stencil/*.rs') }}
          restore-keys: instructions-buildscript-
      # Twice each, so a count that stops being repeatable fails here rather
      # than passing or failing by chance later.
      - run: nix develop .#perf -c cargo bench -p buri --features backend-llvm --bench instructions -- --runs=2
      # What this run measured, as a baseline file: commit it to re-bless.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: instructions-baseline
          path: /tmp/buri-instructions/baseline.txt
          retention-days: 7
          if-no-files-found: ignore

  # The compiler's branch coverage from end-to-end tests only, which must never
  # fall (coverage/src/main.rs). x86_64 Linux, the baseline's host.
  # `coverage-build` builds the instrumented `buri` and the tests once, so
  # every shard runs the same `buri`; each shard runs a quarter of the tests;
  # `coverage` merges the shards' profiles and gates.
  coverage-build:
    name: coverage build
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
        with:
          determinate: false
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu-2404-x86_64-coverage
          workspaces: |
            . -> target/coverage
            . -> target/coverage-buri
      # The runtime archive `cli/build.rs` builds, which rust-cache drops (see
      # the `test` job).
      - uses: actions/cache@v6
        with:
          path: |
            target/coverage/debug/build
            target/coverage-buri/debug/build
          key: coverage-buildscript-${{ hashFiles('flake.lock', 'cli/build.rs', 'cli/runtime/**', 'crates/hash/src/build/sha256.rs', 'crates/stencil/build.rs', 'crates/stencil/src/compiler/backend/stencil/*.rs') }}
          restore-keys: coverage-buildscript-
      - run: nix develop .#coverage -c cargo run -p buri-coverage -- --build
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-build
          path: target/coverage/build
          retention-days: 7

  coverage-shard:
    name: coverage shard (${{ matrix.shard }}/4)
    needs: coverage-build
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: blacksmith-8vcpu-ubuntu-2404
    env:
      NEXTEST_TEST_THREADS: 16
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
        with:
          determinate: false
      - uses: oven-sh/setup-bun@v2
      # The test job's tools, which the suite checks are on PATH.
      - run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld mold llvm binutils musl-dev musl-tools
          ls -d /usr/lib/llvm-*/bin | sort -V | tail -1 >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v8
        with:
          name: coverage-build
          path: target/coverage/build
      - run: nix develop .#coverage -c cargo run -p buri-coverage -- --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: target/coverage/shard
          retention-days: 7

  coverage:
    name: coverage
    needs: coverage-shard
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    # The ratchet's push to main. No other job writes.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
        with:
          determinate: false
      - uses: actions/download-artifact@v8
        with:
          name: coverage-build
          path: target/coverage/build
      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-shard-*
          path: target/shards
      - run: nix develop .#coverage -c cargo run -p buri-coverage -- --merge=target/shards
      # The ratchet: a rise in coverage becomes the baseline. On a push to main
      # it's committed there; anywhere else the commit is only printed. If main
      # moved meanwhile, the rise is checked again against main's baseline. A
      # push made with this job's token starts no workflow, and `[skip ci]`
      # says so twice, so the commit can't loop.
      - name: Raise the baseline
        env:
          WRITE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tested=$(git rev-parse HEAD)
          for attempt in 1 2 3 4 5; do
            if [ "$WRITE" = true ]; then
              git fetch --quiet origin main
              git checkout --quiet --detach FETCH_HEAD
            fi
            nix develop .#coverage -c cargo run -q -p buri-coverage -- --raise
            if [ -z "$(git status --porcelain -- coverage)" ]; then
              exit 0
            fi
            git add coverage/compiler-branches.txt coverage/compiler.txt
            git commit -q -m "coverage: raise the baseline to what ${tested:0:9} measured [skip ci]" \
              -m "Written by the coverage job of CI run ${{ github.run_id }}."
            if [ "$WRITE" != true ]; then
              echo "Not a push to main, so this commit is not pushed:"
              git show --stat HEAD
              exit 0
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "main kept moving; the baseline was not raised" >&2
          exit 1
      # What this run measured.
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-baseline
          path: |
            target/coverage/compiler-branches.txt
            target/coverage/compiler.txt
          retention-days: 7
          if-no-files-found: ignore

  # `cargo install buri` on a machine with nothing installed on it.
  # `--no-default-features` is the dependency-free build `cli/Cargo.toml`'s bar is
  # about, and this runner is deliberately the one with no clang and no musl.
  minimal:
    timeout-minutes: 30
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p buri --no-default-features

  # The formal development: the build must succeed, the audit must record no
  # sorryAx, and no proof may contain `sorry`/`admit`.
  lean:
    timeout-minutes: 30
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - name: Install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v6
        with:
          path: formal/.lake
          key: lake-${{ runner.os }}-${{ hashFiles('formal/lean-toolchain', 'formal/lakefile.toml') }}
      - working-directory: formal
        run: |
          lake build
          lake env lean Audit.lean | tee audit.out
          ! grep -q sorryAx audit.out
          ! grep -rn 'sorry\|admit' Buri/

  # The editor grammars: the generated grammar compiles, every highlight query
  # compiles, and the tree-sitter parse of every test source agrees with the
  # compiler's own verdict. `check.sh` is the grammar directory's own test runner
  # — a contributor runs it by hand — and not CI machinery, which is why it is the
  # one script this workflow still calls.
  tree-sitter:
    timeout-minutes: 30
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: npm install -g tree-sitter-cli
      - run: cargo build -p buri --example parse_verdicts
      - run: ./check.sh
        working-directory: editors/tree-sitter-buri
      - run: ./check.sh
        working-directory: editors/tree-sitter-buri-build

  # Packaging: the flake evaluates and the from-source toolchain builds. The
  # derivation carries its own runtime-archive assertion in `postBuild`, because
  # the sandbox is the only place that archive exists. No binary cache action:
  # measured, its post step cost five minutes to upload a store path no later run
  # can hit.
  #
  # `.#from-source`, not `.#default`: `packages.default` is now the PREBUILT
  # install that fetches the `v<version>` release tarball, so a `nix build
  # .#default` here would depend on a published release existing and race the
  # nightly's release-create step — coupling this per-push hermetic gate to
  # releases. `packages.from-source` is the from-source LLVM-backend build that
  # this gate is actually about, and it needs no release. For the same reason the
  # flake check is `--no-build` (evaluate every system's outputs, catching a
  # broken flake or a bad placeholder, without trying to *build* the prebuilt
  # default and fetch a tarball that does not exist yet).
  nix:
    timeout-minutes: 30
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      # `determinate: false` keeps upstream Nix, which v21 stopped defaulting to.
      - uses: DeterminateSystems/nix-installer-action@v23
        with:
          determinate: false
      - run: nix flake check --all-systems --no-build
      - run: nix build .#from-source
      - run: ./result/bin/buri version

  # protobuf's own conformance suite against the codecs the proto generator
  # writes. The runner is a C++ test binary nixpkgs doesn't package, so the
  # flake builds it from the pinned release (`packages.conformance-runner`), and
  # `vectors::proto::the_conformance_runner_passes` runs it. Every other job
  # defers that test here; they replay the recording of it instead.
  proto-conformance:
    name: protobuf conformance
    timeout-minutes: 30
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
        with:
          determinate: false
      - run: nix build .#conformance-runner -o runner
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
      - run: cargo test -p buri --test vectors -- proto::the_conformance_runner_passes --nocapture
        env:
          CONFORMANCE_TEST_RUNNER: ${{ github.workspace }}/runner/bin/conformance_test_runner

  # The standard library's MC/DC from the conformance corpus on JavaScript,
  # JavaScript --release, the stencil backend and LLVM --release, which must
  # never fall, in total or in any module (coverage/stdlib/src/main.rs). x86_64
  # Linux, the baseline's host. The backends must also count alike.
  stdlib-coverage:
    name: stdlib coverage
    runs-on: blacksmith-8vcpu-ubuntu-2404
    env:
      CC: clang
    timeout-minutes: 45
    # The ratchet's push to main. No other job writes.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu-2404-x86_64-stdlib-coverage
      - uses: oven-sh/setup-bun@v2
      - run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld mold llvm binutils musl-dev musl-tools
          ls -d /usr/lib/llvm-*/bin | sort -V | tail -1 >> "$GITHUB_PATH"
          # The musl std a hermetic native test binary links against.
          rustup target add "$(uname -m)-unknown-linux-musl"
      # The `release` job's LLVM, which `--release` builds with.
      - name: LLVM 21 from apt.llvm.org
        run: |
          set -euo pipefail
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          codename=$(lsb_release -cs)
          echo "deb http://apt.llvm.org/$codename/ llvm-toolchain-$codename-21 main" \
            | sudo tee /etc/apt/sources.list.d/llvm21.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            llvm-21-dev libpolly-21-dev libzstd-dev zlib1g-dev
          case "$(llvm-config-21 --version)" in
            21.*) ;;
            *) echo "::error::apt.llvm.org served $(llvm-config-21 --version), not 21.x"; exit 1 ;;
          esac
          echo "LLVM_SYS_211_PREFIX=$(llvm-config-21 --prefix)" >> "$GITHUB_ENV"
      - run: cargo run -p buri-stdlib-coverage
      # The ratchet, as the compiler coverage job's: a rise becomes the
      # baseline. On a push to main it's committed there; anywhere else the
      # commit is only printed. If main moved meanwhile, the rise is checked
      # again against main's baseline. A push made with this job's token starts
      # no workflow, and `[skip ci]` says so twice, so the commit can't loop.
      - name: Raise the baseline
        env:
          WRITE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tested=$(git rev-parse HEAD)
          for attempt in 1 2 3 4 5; do
            if [ "$WRITE" = true ]; then
              git fetch --quiet origin main
              git checkout --quiet --detach FETCH_HEAD
            fi
            cargo run -q -p buri-stdlib-coverage -- --raise
            if [ -z "$(git status --porcelain -- coverage/stdlib-mcdc.txt coverage/stdlib.txt)" ]; then
              exit 0
            fi
            git add coverage/stdlib-mcdc.txt coverage/stdlib.txt
            git commit -q -m "coverage: raise the stdlib MC/DC baseline to what ${tested:0:9} measured [skip ci]" \
              -m "Written by the stdlib-coverage job of CI run ${{ github.run_id }}."
            if [ "$WRITE" != true ]; then
              echo "Not a push to main, so this commit is not pushed:"
              git show --stat HEAD
              exit 0
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "main kept moving; the baseline was not raised" >&2
          exit 1
      # What this run measured.
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stdlib-coverage-baseline
          path: |
            target/stdlib-coverage/stdlib-mcdc.txt
            target/stdlib-coverage/stdlib.txt
          retention-days: 7
          if-no-files-found: ignore
