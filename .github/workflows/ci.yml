name: CI

# One workflow, and this is it. There used to be a second file for the Linux
# leg; the split cost a duplicated toolchain block and a composite action, and
# bought nothing that a job in here does not.
#
# Two vocabularies are deliberately absent. There are no backend names in a job
# or a step name: this repository has one **dev** build, which is the default
# and which no flag selects, and one **release** build, which is `--release`.
# Which code generator serves each is `backend::select`'s business and changes
# without CI changing. Where a `run:` line names a cargo feature or a test
# module it is naming a build flag, not a job's subject.
#
# Three things about the Linux jobs are decisions rather than defaults:
#
# * **apt, not the flake.** design/native/BUILD-AND-WATCH.md §3.4 is titled
#   "Without nix" and it is the path a Debian-like contributor walks: a Rust
#   toolchain and a C compiler and nothing else. The flake pins a toolchain for
#   contributors and is held green by the `nix` job below, so nix is covered by
#   the job that exists for it. Running the suite inside `nix develop` would
#   substitute nixpkgs' clang for the runner's and answer a different question.
#
# * **`CC: clang`, and it is LOAD-BEARING.** `cli/build.rs` degrades rather than
#   breaks: the stencil generators
#   (`cli/src/compiler/backend/stencil/sources.rs::compile_flags`) pass
#   `--target=<triple>`, `-nostdinc` and `-isystem $(cc -print-resource-dir)`
#   for BOTH Linux targets — including the host's own, on a Linux host — and the
#   generated C uses `musttail`. gcc understands none of that, so `can_build`
#   fails, an EMPTY library is written, `stencil::AVAILABLE` is false, and every
#   test in `cli/tests/native/stencil.rs` returns early: the suite passes having
#   checked nothing. That is why the stencil libraries are ASSERTED non-empty
#   below rather than believed — and, beside them, the runtime archive, which
#   degrades the same way and gained a second route into it when the runtime
#   grew a dependency tree it might not be able to resolve. On macOS `clang` is
#   what `cc` already is, so the macOS leg pays nothing for it.
#   `build/link.rs` reads `CC` too, so this also decides which driver the
#   product's own link runs through. It is set on the four jobs that verify the
#   native path and nowhere else, so that `minimal`, `lean`, `tree-sitter` and
#   `nix` do not pay a minute of stencil generation they never read.
#
# * **clang, lld, mold, llvm and binutils, all five.** clang for the above; mold
#   *and* lld because `build/link.rs::choose` prefers mold on Linux and every
#   ELF byte this compiler emits had, until these runners, been accepted by
#   exactly one linker; `llvm` for the unversioned `llvm-nm`, `llvm-objdump` and
#   `llvm-readelf` that `cli/tests/native/stencil.rs::cross_tools` probes before
#   it will run the cross-link tests — without them those tests skip.
#
# `push:` with no branch filter: every push to every branch in this repository.
# `pull_request:` is what covers the case `push:` cannot see — a pull request
# from a **fork**, whose branch lives in someone else's repository and pushes
# nothing here. Without it a contributor's first pull request would arrive with
# no CI at all, which is the one situation where CI is worth the most.
#
# The cost is a duplicate run on a pull request opened from a branch in this
# repository: the push and the pull request are two events about the same
# commits. That is accepted rather than filtered, because the filters that
# remove it (`push: branches: [main]`, or a paths filter) also remove the
# every-push coverage that catches a break before a pull request exists. The
# `concurrency` group below still collapses superseded runs of each.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per ref. A push that supersedes another cancels it, because the
# question this workflow answers is about the tip and not about the history.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------------------
  # The whole Rust suite, on every host this toolchain supports.
  #
  # One integration binary per domain plus the unit tests; `cli/tests/README.md`
  # is the map. Compiled programs are executed with `bun`, and the constant-stack
  # tail-call tests additionally run under `node` — JavaScriptCore has proper
  # tail calls and V8 does not, which is why those tests exist and why both
  # runtimes must be present.
  #
  # macOS is arm64 and builds its own stencil library; the two Linux legs build
  # theirs. There is no `ubuntu-latest` leg without clang: it was the same suite
  # with the native tests silently skipped, which is the one shape of green this
  # workflow exists to refuse.
  # ---------------------------------------------------------------------------
  test:
    name: test (${{ matrix.arch }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: blacksmith-12vcpu-macos-latest, arch: arm64 }
          - { os: blacksmith-4vcpu-ubuntu-2404, arch: x86_64 }
          - { os: blacksmith-4vcpu-ubuntu-2404-arm, arch: arm64 }
    runs-on: ${{ matrix.os }}
    env:
      CC: clang
    # Measured, not guessed: the `native` domain alone is 750 s of the run and
    # `the_corpus_census_is_a_ratchet` is 700 s of that — thirty-one corpus
    # files through an unoptimized backend. Add a cold runner's toolchain build
    # and the benchmark's LTO'd `bench` profile and an hour is a cap rather than
    # a target.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Two architectures must not share a key: the cached artifacts are the
          # host's.
          shared-key: ${{ matrix.os }}-${{ matrix.arch }}
      - uses: oven-sh/setup-bun@v2
      - if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld mold llvm binutils
          # Debian's `llvm` package installs the UNVERSIONED tool names under
          # /usr/lib/llvm-<N>/bin and only the versioned ones in /usr/bin.
          # `cross_tools` probes the unversioned names, so the directory goes on
          # PATH rather than this file guessing a version. Highest wins.
          ls -d /usr/lib/llvm-*/bin | sort -V | tail -1 >> "$GITHUB_PATH"
      # Asserted, not assumed. A missing tool otherwise presents as a test that
      # skipped or as a link failure inside a suite, and both read as "green" or
      # as "a compiler bug" rather than as "the runner changed".
      - name: Every tool this workflow assumes
        run: |
          set -euo pipefail
          for t in cc clang node bun; do
            command -v "$t" >/dev/null || { echo "::error::$t is not on PATH"; exit 1; }
          done
          if [ "$RUNNER_OS" = Linux ]; then
            for t in ld.lld mold llvm-nm llvm-objdump llvm-readelf readelf; do
              command -v "$t" >/dev/null || { echo "::error::$t is not on PATH"; exit 1; }
            done
          fi
          cc --version | head -1
          node --version
          bun --version

      # Before the suite, not after: an empty stencil library is a suite that
      # passes vacuously, and the diagnosis should not have to be reconstructed
      # from a green run. `--tests` is what runs `cli/build.rs`.
      - run: cargo build -p buri --tests
      - name: The stencil libraries are not empty
        run: bash .github/scripts/assert-stencils.sh
      # The same gate for the other blob the build script writes. It degrades
      # the same way — an empty archive on a host with no runtime, and since the
      # `net` feature on a dependency tree that cannot be resolved — and an
      # empty one makes every native test skip and the suite pass vacuously.
      # It also asserts the size budget and that none of the four networking
      # crates has been linked in; the script argues both.
      - name: The runtime archive is not empty
        run: bash .github/scripts/assert-runtime-archive.sh

      # `--no-fail-fast` because the test binaries are domains, and one failing
      # domain should not hide the others.
      - run: cargo test -p buri --no-fail-fast

      # Deliberately NOT `-D warnings`. The bar this repository states is the
      # panic-free lint set in the workspace manifest, and every lint in it is
      # `deny` — so a violation is an ERROR and fails this step already. Turning
      # the remaining warnings into errors would make CI's verdict depend on
      # clippy's version rather than on the repository's rules.
      - if: runner.os == 'Linux'
        run: cargo clippy -p buri --all-targets

      # The validation gate: compile every corpus and measure nothing.
      # `--quick` is named in `cli/benches/compiler.rs` as the CI shape and is
      # held to staying under a second there.
      - if: runner.os == 'Linux'
        run: cargo bench -p buri --bench compiler -- --validate --quick

      # A failing test's scratch directory is its evidence (cli/tests/README.md).
      # `BURI_KEEP` is NOT set: a panicking test keeps its own tree regardless
      # (`harness/mod.rs`), while `BURI_KEEP` would also disable the sweep and
      # keep every passing suite's tree, which is the 14 GB that filled a disk
      # twice.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scratch-test-${{ matrix.os }}-${{ matrix.arch }}
          path: target/tmp
          retention-days: 7
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Linux arm64: the programs a dev build produces are executed.
  #
  # Compiling is what `test` above proves. This job runs the artifacts — the
  # stack guard's `mprotect`, Linux's signal disposition for a `PROT_NONE` page
  # inside a mapping, both linkers' idea of an ELF image, and two builds of one
  # repository compared byte for byte.
  # ---------------------------------------------------------------------------
  linux-arm64:
    name: linux arm64 (the programs run)
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    env:
      CC: clang
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu-24.04-arm-arm64
      - uses: oven-sh/setup-bun@v2
      - run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld mold llvm binutils
          ls -d /usr/lib/llvm-*/bin | sort -V | tail -1 >> "$GITHUB_PATH"
      - run: cargo build -p buri --tests
      - name: The stencil libraries are not empty
        run: bash .github/scripts/assert-stencils.sh
      # The same gate for the other blob the build script writes. It degrades
      # the same way — an empty archive on a host with no runtime, and since the
      # `net` feature on a dependency tree that cannot be resolved — and an
      # empty one makes every native test skip and the suite pass vacuously.
      # It also asserts the size budget and that none of the four networking
      # crates has been linked in; the script argues both.
      - name: The runtime archive is not empty
        run: bash .github/scripts/assert-runtime-archive.sh

      # FIRST, and alone. This is the liveness gate: every test in
      # `cli/tests/native/stencil.rs` opens with `if !supported() { return; }`,
      # so a host with no stencils runs the whole file, reports every test as
      # PASSED, and proves nothing. The census's `println!` sits on the far side
      # of that guard and is the only thing that can tell the two apart — so it
      # is asked before anything below spends twelve minutes proving nothing.
      #
      # ALONE and `--test-threads=1` because `--nocapture` with the default
      # thread count lets two tests write to one line, and this assertion reads
      # lines. (Even alone, libtest's own `test <name> ... ` prefix shares a
      # line with the first `println!` — `assert-suite-ran.sh` handles that, and
      # says where it learned it.)
      - name: The suite was live, and the corpus is at macOS parity
        run: |
          set -o pipefail
          cargo test -p buri --test native stencil::the_corpus_census_is_a_ratchet \
            -- --nocapture --test-threads=1 2>&1 | tee census.log
          bash .github/scripts/assert-suite-ran.sh census.log

      # The rest, in parallel, which is how it is written to run: one scratch
      # tree per test and one runtime archive per process. Every test here RUNS
      # A PROGRAM — including `the_corpus_files_it_compiles_pass`, and including
      # `a_runaway_recursion_faults_at_the_guard` and
      # `a_deep_recursion_inside_the_stack_still_answers`, which are the first
      # execution anywhere of `asm::install_guard`'s `mprotect` and of Linux's
      # signal disposition for a `PROT_NONE` page inside a mapping.
      #
      # `--skip` the census: it just ran, it is the longest test in the file,
      # and running it twice buys nothing.
      - name: The programs run
        run: |
          set -o pipefail
          cargo test -p buri --test native stencil:: -- --nocapture \
            --skip the_corpus_census_is_a_ratchet 2>&1 | tee suite.log

      # Leak parity: heap-stats and NOT valgrind, deliberately. The claim is
      # that the code generator leaves *exactly the same* blocks live at two
      # scales of the same loop, which a leak checker's own accounting cannot
      # state, and valgrind would cost tens of minutes on a corpus this size.
      #
      # The COUNT is asserted, not the probe's own output: the harness captures
      # the child's stderr and only prints it when an assertion fails, so
      # `live=0` never reaches this log. Three selected and three passed is what
      # says all three ran; that they were not vacuous is the liveness step's
      # job, and `supported()` does not change between two runs on one host.
      - name: Leak parity through buri_rt_heap_stats
        run: |
          set -o pipefail
          cargo test -p buri --test native -- \
            stencil::nothing_is_leaked \
            stencil::the_glue_balances \
            stencil::interpolating_in_a_loop_leaks_nothing \
            2>&1 | tee leaks.log
          grep -qE 'test result: ok\. 3 passed' leaks.log \
            || { echo "::error::the three heap-stats tests did not all run"; exit 1; }

      # `--check-reproducible` driven through the CLI: two builds from two
      # freshly opened sessions with the cache off, into two directories,
      # compared byte for byte. Silent on agreement.
      #
      # A repository written here rather than one of the checked-in ones,
      # because both native binaries in `cli/tests/example` are refused by the
      # dev build — `//cmd/server` needs `host.HostFs.readFile` and
      # `//tools/report` needs `host.HostEnv.args`, and neither is
      # implemented (measured, not assumed: both were tried). A four-line
      # program that only prints is what this needs; the artifact being small
      # does not make its bytes less reproducible.
      #
      # `mktemp -d` rather than a directory in the checkout, because nothing may
      # write into a checked-in tree (cli/tests/README.md) and this is the CLI
      # rather than a harness that would make its own scratch.
      - name: --check-reproducible on a linked Linux artifact
        run: |
          set -euo pipefail
          cargo build -p buri
          bin=$PWD/target/debug/buri
          work=$(mktemp -d)
          mkdir -p "$work/repo/cmd/app"
          printf '# a repository with no tags\n' > "$work/repo/REPO.buri"
          cat > "$work/repo/cmd/app/BUILD.buri" <<'BUILD'
          binary {
              outputs: [
                  { platform: LINUX, arch: ARM64 },
              ]
          }
          BUILD
          cat > "$work/repo/cmd/app/main.buri" <<'SRC'
          from "core/host/lib.buri" import { stdout };
          export fn main(): Result<(), Str> {
            let _ = stdout.println("reproducible");
            .Ok(())
          }
          SRC
          cd "$work/repo"
          "$bin" build //cmd/app --output=linux/arm64 --check-reproducible

      # mold AND ld.lld. `BURI_LINKER` is the documented override
      # (`build/link.rs`'s header), and the test prints which one it used, so
      # the assertion is on what happened rather than on what was asked for. The
      # ELF properties are checked once per linker, on that linker's own output,
      # because `--gc-sections` and the stack marking are the linker's behaviour
      # and not the emitter's.
      #
      # `target/tmp` is cleared first so that the artifact found afterwards is
      # unambiguously the one this step produced: the suite names its scratch
      # tree for the process id, and every `cargo test` invocation is a new one.
      - name: Both linkers, and the image each produces
        run: |
          set -euo pipefail
          for linker in mold lld; do
            echo "::group::BURI_LINKER=$linker"
            rm -rf target/tmp
            set -o pipefail
            BURI_LINKER=$linker cargo test -p buri --test native \
              stencil::the_products_own_link -- --nocapture 2>&1 | tee "link-$linker.log"
            grep -q "linked with cc+$linker" "link-$linker.log" || {
              echo "::error::BURI_LINKER=$linker did not reach link::choose — the test may have skipped"
              exit 1
            }
            app=$(find target/tmp -path '*/product-link/app' -type f -print -quit 2>/dev/null || true)
            [ -n "$app" ] || {
              echo "::error::the product's link left no artifact, so the suite skipped"
              exit 1
            }
            bash .github/scripts/assert-elf.sh "$app"
            # The other half of the stack check: a linker that had to guess
            # about the stack says so, and `build/link.rs` captures its stderr,
            # so a warning that did not fail the link would otherwise pass
            # unread.
            if grep -qiE 'requires executable stack|missing \.note\.GNU-stack' "link-$linker.log"; then
              echo "::error::$linker warned about an executable stack"
              exit 1
            fi
            # And it still runs, linked by this linker, on this machine.
            [ "$("$app")" = "500500" ] || {
              echo "::error::the artifact $linker produced printed the wrong answer"
              exit 1
            }
            echo "::endgroup::"
          done

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scratch-linux-arm64
          path: |
            target/tmp
            census.log
            suite.log
            leaks.log
            link-*.log
          retention-days: 7
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Linux x86_64: the programs a dev build produces are executed, and the cross
  # emission.
  #
  # The twin of the job above on the other instruction set, and it is the only
  # place any of this is executed: nothing on a maintainer's machine can run a
  # single x86-64 instruction, so `asm.rs`'s SysV `main`, `jit.rs`'s `rel32` and
  # rip-relative patches and `glue.rs`'s SysV stub are proved here or nowhere.
  # This job used to assert that the executing suite SKIPPED; it now asserts
  # that it RAN, by the same census line, which is the difference the entry
  # point made.
  #
  # The cross half stays: this host emits `linux-arm64` objects, links them with
  # `ld.lld` and checks every relocation resolves. Running that on a second host
  # is what says the emission does not depend on the machine it was made on.
  # ---------------------------------------------------------------------------
  linux-x86_64:
    name: linux x86_64 (the programs run)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      CC: clang
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu-24.04-x86_64
      - uses: oven-sh/setup-bun@v2
      - run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld mold llvm binutils
          ls -d /usr/lib/llvm-*/bin | sort -V | tail -1 >> "$GITHUB_PATH"
      - run: cargo build -p buri --tests
      - name: The stencil libraries are not empty
        run: bash .github/scripts/assert-stencils.sh
      # The same gate for the other blob the build script writes. It degrades
      # the same way — an empty archive on a host with no runtime, and since the
      # `net` feature on a dependency tree that cannot be resolved — and an
      # empty one makes every native test skip and the suite pass vacuously.
      # It also asserts the size budget and that none of the four networking
      # crates has been linked in; the script argues both.
      - name: The runtime archive is not empty
        run: bash .github/scripts/assert-runtime-archive.sh

      # FIRST, and alone — the liveness gate, for the reason the arm64 job
      # states: every test in `cli/tests/native/stencil.rs` opens with
      # `if !supported() { return; }`, so a host the backend cannot serve runs
      # the whole file, reports every test as PASSED, and proves nothing.
      - name: The suite was live, and the corpus is at macOS parity
        run: |
          set -o pipefail
          cargo test -p buri --test native stencil::the_corpus_census_is_a_ratchet \
            -- --nocapture --test-threads=1 2>&1 | tee census.log
          bash .github/scripts/assert-suite-ran.sh census.log

      # Every test here RUNS A PROGRAM built by the SysV entry point, including
      # `a_runaway_recursion_faults_at_the_guard`, which is the first execution
      # anywhere of `install_guard`'s x86-64 `mprotect`.
      - name: The programs run
        run: |
          set -o pipefail
          cargo test -p buri --test native stencil:: -- --nocapture \
            --skip the_corpus_census_is_a_ratchet 2>&1 | tee suite.log

      - name: Leak parity through buri_rt_heap_stats
        run: |
          set -o pipefail
          cargo test -p buri --test native -- \
            stencil::nothing_is_leaked \
            stencil::the_glue_balances \
            stencil::interpolating_in_a_loop_leaks_nothing \
            2>&1 | tee leaks.log
          grep -qE 'test result: ok\. 3 passed' leaks.log \
            || { echo "::error::the three heap-stats tests did not all run"; exit 1; }

      # The same four-line program the arm64 job builds, for the same reason:
      # both native binaries in `cli/tests/example` are refused by the dev
      # build, and a small artifact's bytes are no less reproducible.
      - name: --check-reproducible on a linked Linux artifact
        run: |
          set -euo pipefail
          cargo build -p buri
          bin=$PWD/target/debug/buri
          work=$(mktemp -d)
          mkdir -p "$work/repo/cmd/app"
          printf '# a repository with no tags\n' > "$work/repo/REPO.buri"
          cat > "$work/repo/cmd/app/BUILD.buri" <<'BUILD'
          binary {
              outputs: [
                  { platform: LINUX, arch: X86_64 },
              ]
          }
          BUILD
          cat > "$work/repo/cmd/app/main.buri" <<'SRC'
          from "core/host/lib.buri" import { stdout };
          export fn main(): Result<(), Str> {
            let _ = stdout.println("reproducible");
            .Ok(())
          }
          SRC
          cd "$work/repo"
          "$bin" build //cmd/app --output=linux/x86_64 --check-reproducible

      - name: Both linkers, and the image each produces
        run: |
          set -euo pipefail
          for linker in mold lld; do
            echo "::group::BURI_LINKER=$linker"
            rm -rf target/tmp
            set -o pipefail
            BURI_LINKER=$linker cargo test -p buri --test native \
              stencil::the_products_own_link -- --nocapture 2>&1 | tee "link-$linker.log"
            grep -q "linked with cc+$linker" "link-$linker.log" || {
              echo "::error::BURI_LINKER=$linker did not reach link::choose — the test may have skipped"
              exit 1
            }
            app=$(find target/tmp -path '*/product-link/app' -type f -print -quit 2>/dev/null || true)
            [ -n "$app" ] || {
              echo "::error::the product's link left no artifact, so the suite skipped"
              exit 1
            }
            bash .github/scripts/assert-elf.sh "$app"
            if grep -qiE 'requires executable stack|missing \.note\.GNU-stack' "link-$linker.log"; then
              echo "::error::$linker warned about an executable stack"
              exit 1
            fi
            [ "$("$app")" = "500500" ] || {
              echo "::error::the artifact $linker produced printed the wrong answer"
              exit 1
            }
            echo "::endgroup::"
          done

      - name: Cross emission and cross link, from x86-64
        run: |
          set -o pipefail
          cargo test -p buri --test native -- --nocapture \
            stencil::linux_arm64_objects_link_and_every_relocation_resolves \
            stencil::a_cross_emission_is_reproducible \
            2>&1 | tee cross.log
          grep -qE 'test result: ok\. 2 passed' cross.log \
            || { echo "::error::the two cross tests did not both run — ld.lld or the llvm tools may be missing, which makes cross_tools() skip"; exit 1; }

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scratch-linux-x86_64
          path: |
            target/tmp
            census.log
            suite.log
            leaks.log
            link-*.log
            cross.log
          retention-days: 7
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # The release build. x86-64 only, ADVISORY.
  #
  # `continue-on-error: true`, and the reason is not timidity. LLVM 21 is not in
  # Ubuntu 24.04 — noble ships 18 — so this job depends on apt.llvm.org, which
  # is third-party infrastructure with no uptime guarantee and a package set
  # that moves. design/native/BUILD-AND-WATCH.md §3.4 names it as the Debian
  # answer, so it is the right source; but a red X caused by a 404 teaches
  # people to ignore a red X, and the dev matrix above is what this workflow is
  # for. If this job proves stable over a few weeks, delete the
  # `continue-on-error` line and nothing else.
  #
  # arm64 is not attempted: apt.llvm.org's architecture coverage per release is
  # not something to discover inside a required job.
  #
  # The version is asserted rather than assumed. CODEGEN-LLVM.md §8.1 allows
  # exactly one supported LLVM and `cli/Cargo.toml`'s `llvm21-1` is one half of
  # that decision; a silently substituted 22 is precisely what §3.4 says a
  # compiler claiming byte-identical output must not accept.
  # ---------------------------------------------------------------------------
  release:
    name: release build (x86_64, advisory)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      CC: clang
    timeout-minutes: 75
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu-24.04-x86_64-release
      - uses: oven-sh/setup-bun@v2
      - run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld mold llvm binutils
          ls -d /usr/lib/llvm-*/bin | sort -V | tail -1 >> "$GITHUB_PATH"

      - name: Install LLVM 21 from apt.llvm.org
        run: |
          set -euo pipefail
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          codename=$(lsb_release -cs)
          echo "deb http://apt.llvm.org/$codename/ llvm-toolchain-$codename-21 main" \
            | sudo tee /etc/apt/sources.list.d/llvm21.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            llvm-21-dev libpolly-21-dev libzstd-dev zlib1g-dev

      - name: Assert it is 21, and export its prefix
        run: |
          set -euo pipefail
          v=$(llvm-config-21 --version)
          case "$v" in
            21.*) echo "llvm-config-21: $v" ;;
            *) echo "::error::apt.llvm.org served $v, not 21.x"; exit 1 ;;
          esac
          echo "LLVM_SYS_211_PREFIX=$(llvm-config-21 --prefix)" >> "$GITHUB_ENV"

      # The fourth native job, and the same liveness gate as the other three:
      # an empty archive here would make the agreement test below compare two
      # backends that both skipped. `--tests` is what runs `cli/build.rs`, and
      # it is work the step after it would do anyway.
      - run: cargo build -p buri --tests --features backend-llvm
      - name: The runtime archive is not empty
        run: bash .github/scripts/assert-runtime-archive.sh

      # The agreement test (ARCHITECTURE.md §4) is what makes the release
      # build's code generator worth turning on, and it only exists with both.
      - run: cargo test -p buri --no-fail-fast --features backend-llvm

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scratch-release-x86_64
          path: target/tmp
          retention-days: 7
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # The language server's 50 ms bar.
  #
  # `cli/tests/build/repositories.rs`'s two `BURI_PERF` tests are the only
  # opt-in tests in the suite: they assert milliseconds rather than work, so a
  # debug build fails them on the profile rather than on the change and they
  # are off unless asked for. Off by default and named in no job is a gate
  # nobody runs, which is what this job is for.
  #
  # arm64, because the bar was calibrated on an M-series mac and a runner's
  # architecture is the one thing about it that can be matched.
  #
  # **Required, not advisory, and measured before it was made so.** The bar is
  # 50 ms a request. Over three runs on this runner the slowest request of the
  # 69-request session was 6, 7 and 6 ms, the slowest of the 145 opens was 5, 5
  # and 6 ms, and the restore's two halves were 1 ms and 2 ms an open every
  # time. A request has to take seven times longer than it does before this job
  # has an opinion, so a red X here is a regression and not a noisy neighbour —
  # which is the whole bar for a timing gate, because one that cries wolf gets
  # deleted. If a future runner is genuinely slower,
  # the tests read `BURI_PERF_BUDGET_SCALE` — a multiplier on the 50 ms,
  # defaulting to 1 — so the widening is one `env:` line here rather than an
  # edit to the assertion. Nothing sets it today, and the numbers above are why.
  #
  # No `CC: clang` and no apt: this job drives `buri lsp` over a pipe and links
  # nothing, so the stencil libraries would be a minute spent on bytes it never
  # reads. `--release` is the profile the numbers mean anything in, and its
  # artifacts are not the dev matrix's, so the cache key is its own.
  # ---------------------------------------------------------------------------
  language-server-budget:
    name: language server budget (arm64)
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    env:
      BURI_PERF: 1
    # The whole step — a cold, link-time-optimized release build of the
    # toolchain and both tests — is under two minutes. Thirty is a cap.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu-24.04-arm-release
      # One thread: two language servers on one runner would be timing each
      # other's contention. `--nocapture` because both tests print their
      # slowest requests on a pass, and this log is where the next
      # recalibration reads them.
      - name: Every editor request inside its budget
        run: |
          cargo test --release -p buri --test build repositories::language_server_ \
            -- --nocapture --test-threads=1

  # ---------------------------------------------------------------------------
  # `cargo install buri` on a machine with nothing installed on it.
  #
  # A job rather than an assertion because "it builds without the optional
  # system libraries" is only true if something builds it that way, and this
  # runner is deliberately the one with nothing. `--no-default-features` is the
  # dependency-free build the bar in `cli/Cargo.toml` is about, and it is the
  # one that catches a `#[cfg]` written only one way. The default-feature build
  # needs no job of its own: every `test` leg above is one.
  # ---------------------------------------------------------------------------
  minimal:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p buri --no-default-features

      # The other half of "cargo install buri works": the tarball has to carry
      # what the build script compiles. It stopped doing so once the runtime
      # became a cargo package — `cargo package` skips a nested package's whole
      # directory — and this is the assertion that the repair holds. Here rather
      # than in a `test` leg because this job is the one about installing.
      - name: The published crate ships the runtime
        run: bash .github/scripts/assert-package-ships-runtime.sh

  # ---------------------------------------------------------------------------
  # The formal development: the build must succeed, the audit must record no
  # sorryAx, and no proof may contain `sorry`/`admit`. The toolchain is pinned
  # by formal/lean-toolchain; elan reads it.
  # ---------------------------------------------------------------------------
  lean:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: useblacksmith/cache@v5
        with:
          path: formal/.lake
          key: lake-${{ runner.os }}-${{ hashFiles('formal/lean-toolchain', 'formal/lakefile.toml') }}
      - name: Build
        working-directory: formal
        run: lake build
      - name: Audit
        working-directory: formal
        run: |
          lake env lean Audit.lean | tee audit.out
          ! grep -q sorryAx audit.out
      - name: No sorry or admit
        working-directory: formal
        run: "! grep -rn 'sorry\\|admit' Buri/"

  # ---------------------------------------------------------------------------
  # The editor grammar: generated grammar.js compiles, every highlight query
  # compiles, and the tree-sitter parse of every test source agrees with the
  # compiler's own verdict.
  #
  # The verdict is asked for rather than recorded — `check.sh` pipes the corpus
  # through `--example parse_verdicts` and compares — so this needs the
  # tree-sitter CLI and cargo. The build below is what `check.sh` would do for
  # itself; it is written out so that the step that takes the time is the one
  # named for it.
  # ---------------------------------------------------------------------------
  tree-sitter:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm install -g tree-sitter-cli
      - run: cargo build -p buri --example parse_verdicts
      - run: ./check.sh
        working-directory: editors/tree-sitter-buri
      # The build-file grammar is the other half of the same directory: a
      # BUILD.buri ends in `.buri` and is textproto, so it has a grammar of its
      # own. It needs no `parse_verdicts`, so it is a step rather than a job.
      - run: ./check.sh
        working-directory: editors/tree-sitter-buri-build

  # ---------------------------------------------------------------------------
  # Packaging: the flake evaluates and the package builds. This is the
  # `nix run github:...` path users take, so it is held to green like a test.
  #
  # `nix build` also carries the runtime-archive assertion, inside the
  # derivation rather than as a step here: the sandbox is where the archive is
  # built and it is the only place the file exists. flake.nix's `postBuild` says
  # why, and the short version is that this job's failure mode is not a red
  # build but a green one that shipped a toolchain with no native backend.
  # ---------------------------------------------------------------------------
  nix:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v8
      - run: nix flake check --all-systems
      - run: nix build .#default
      - run: ./result/bin/buri version
