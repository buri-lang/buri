name = "Buri"
grammar = "buri"
# Every `.buri` file except the two build files next door. Zed scores each
# language by the length of the file name its longest matching suffix accounted
# for, so this claims four characters of `lib.buri` and `BUILD.buri` goes to the
# language that claims all ten of it. Nothing here needs to exclude the build
# files, and nothing there may claim a bare `buri`.
#
# A `.buri` file that opens as plain text is not this line: it is a language Zed
# could not load. See the pin in `../../extension.toml`.
path_suffixes = ["buri"]
line_comments = ["// ", "/// "]
block_comment = ["/* ", " */"]
autoclose_before = ";:.,=}])>"
tab_size = 2
hard_tabs = false

# `buri format` produces one canonical layout with no options, so formatting on
# save is the same as formatting at any other time.
[[brackets]]
start = "{"
end = "}"
close = true
newline = true

[[brackets]]
start = "("
end = ")"
close = true
newline = false

[[brackets]]
start = "["
end = "]"
close = true
newline = false

[[brackets]]
start = "\""
end = "\""
close = true
newline = false
not_in = ["string", "comment"]
