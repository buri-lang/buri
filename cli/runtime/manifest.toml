# `libburi_rt.a`, the native runtime, as a package of its own.
#
# **This file is a Cargo manifest that is deliberately not named `Cargo.toml`,
# and the reason is packaging.** `cargo package` skips any subdirectory of a
# package that contains a `Cargo.toml` of its own — unconditionally, before
# `include`/`exclude` are consulted, in both its git-driven and its
# filesystem-driven file listers. A manifest here would therefore delete the
# whole of `cli/runtime/` from the published `buri` crate: the nineteen sources
# the archive is built from would not ship, and a `cargo install buri` from a
# registry tarball would fail in `cli/build.rs` with nothing to compile.
#
# So the package is **assembled** rather than checked in: `cli/build.rs` copies
# this file to `$OUT_DIR/rt-pkg/Cargo.toml`, `manifest.lock` beside it as
# `Cargo.lock`, and the `.rs` files beside those, and builds *there*. Nothing
# about the build changes — Cargo still runs `rustc` with the package root as
# its working directory and the crate root as the relative path `lib.rs`, which
# is what the `--remap-path-prefix` in `cli/build.rs` depends on — and
# `cli/runtime/` becomes an ordinary directory of ordinary files that
# `cargo package` ships like any other.
#
# What that costs is `cd cli/runtime && cargo build`, which no longer resolves.
# The build has one driver and it is `cli/build.rs`; `BURI_RUNTIME_RELOCK=1
# cargo build -p buri` is how the lockfile below is regenerated, and
# `cli/build.rs`'s header is where the rest of the workflow is written down.
#
# ## The dependency bar, this side of it
#
# The bar is stated once, in the root `Cargo.toml`, and it is stated there in
# two halves because there are two admitted sets: the **toolchain's**, which a
# contributor installs, and the **runtime's**, which every user *ships*. This
# is the second one, and the extra clause it carries is that the set is closed
# by an exact list rather than by a habit — `dependencies_stay_behind_the_bar`
# in `cli/tests/language/corpus.rs` asserts equality with that list, so a seventh
# crate here is a failing test and not a review comment.
[package]
name = "buri-rt"
version = "0.3.0"
edition = "2024"
description = "The Buri native runtime: the `buri_rt_*` symbols every native backend emits calls to."
license = "MIT"
repository = "https://github.com/buri-lang/buri"
# Built from the checkout, never from a registry.
publish = false

[lib]
# `buri_rt`, because the symbols are `buri_rt_*` and the archive is
# `libburi_rt.a`; the two backends emit the name, so it is a contract rather
# than a preference.
name = "buri_rt"
# The sources sit directly beside this file rather than under `src/`, because
# they predate the manifest and moving nineteen files to gain a level of nesting
# would be churn in every doc link and every git blame.
path = "lib.rs"
# A static library and nothing else: `build/link.rs` hands the archive to the
# platform C driver alongside the objects the backend emitted.
crate-type = ["staticlib"]

# The runtime's admitted set, in full, and it is **closed**: these seven and
# nothing else, each optional, each behind one of the three features below.
#
# Six crates for one capability — an asynchronous networking stack — which is
# a platform interface in exactly the sense the root manifest's bar means, and
# is the largest single thing in this design that the repository could not
# reasonably write. The seventh, `getrandom`, is one capability of its own and
# is argued after them. Each clears all three clauses, and each is named for
# what it is rather than for what it belongs to:
#
# * **`tokio`** — the reactor, the timer wheel and the carrier pool. `epoll` and
#   `kqueue` behind one edge-triggered readiness API, per platform, is the whole
#   of what a hand-written one would have to be, and getting it subtly wrong
#   presents as a hang rather than as a failure.
# * **`hyper`** — HTTP/2 framing. `cli/runtime/http.rs` is a complete cleartext
#   HTTP/1.1 *client* and `cli/runtime/net.rs` frames HTTP/1.1 as a server, both
#   by hand, because a request line, some fields and a body is the easy half.
#   HPACK, per-stream flow control and several requests interleaved on one
#   socket are not, and they are what this crate is here for. **Linked for real
#   since F4**: an ALPN-negotiated `h2` connection is handed to it whole.
# * **`rustls`** — TLS 1.2 and 1.3. `http.rs`'s header has said since it was
#   written that TLS is the shape of problem the bar exists for, and this is
#   the crate it named. **Linked for real since C7**: `https://` goes through
#   it, `tls.rs` is the seam, and the archive carries it.
# * **`ring`** — the crypto provider underneath `rustls`, and the entry that
#   costs the most. See "the provider" below; it is declared here, rather than
#   left to `rustls`'s own feature to pull in, because
#   `dependencies_stay_behind_the_bar` reads *this table* and a crate that
#   ships inside every native binary this compiler produces must be visible to
#   the test that guards what ships. `net.rs` names a type from it for the same
#   reason it names one from each of the others.
# * **`tungstenite`** — RFC 6455 framing and the handshake, which is a
#   protocol with a specification and a test suite rather than an algorithm.
#   **Linked for real since F7**: `listenUpgrade` completes the handshake with
#   `derive_accept_key` and hands the socket to `WebSocket::from_raw_socket`,
#   and every byte after the `101` is framed by it. What `net.rs` keeps is the
#   HTTP/1.1 head that carries the upgrade, which is a status line and four
#   fields; what it hands over is masking, fragmentation, the control-frame
#   rules and the close handshake — none of which is worth writing twice, and
#   all of which is what the Autobahn suite exists to catch people getting
#   wrong.
# * **`quinn`** — QUIC, which is what HTTP/3 runs on: congestion control, loss
#   recovery, stream multiplexing and connection migration over UDP, which is a
#   transport protocol rather than a framing. It is the only entry behind
#   `net-h3` rather than `net`, and the only one that is **off by default**;
#   the feature block below is where that is argued.
#
# ## The seventh, and it buys a different capability
#
# * **`getrandom`** — the operating system's cryptographic generator, behind
#   the `Entropy` effect and `core/crypto`'s `randomBytes` and `token`. It is
#   the only entry here that is not part of the networking stack, and it is
#   behind its own `crypto` feature for that reason: a program that mints a
#   session token has not asked to speak the network, and making it depend on
#   `net` would be a dependency of the manifest rather than of the program.
#
#   **The clause it has to clear is the first one**, because "twenty lines
#   reading `/dev/urandom`" is a real counter-argument and `cli/runtime/rng.rs`
#   already contains those twenty lines. The answer is that they are the wrong
#   twenty lines for this: `rng.rs` reads a *seed*, once, and falls back to the
#   clock when `/dev/urandom` is not there, because a weak seed for a shuffle
#   is better than a program that will not start. Neither of those is
#   acceptable for a key. What is wanted instead is `getrandom(2)` on Linux and
#   `getentropy(2)` on macOS, with the vDSO path where the C library has one,
#   the pre-3.17 `/dev/urandom` fallback where the syscall is missing, `EINTR`
#   retried, a short return filled rather than accepted, and no fallback at all
#   when every source fails — which is a per-platform interface with a decade
#   of errata in it rather than an algorithm. Getting it subtly wrong yields
#   octets that look exactly like the right ones, which is the failure mode the
#   bar's first clause is about.
#
#   It costs almost nothing to ship: `getrandom` is already in `manifest.lock`
#   twice over as a transitive dependency of `ring` and `rand`, it compiles no
#   C, and it needs no build tool the toolchain does not already require.
#
# **Five of the six are linked; one is still referenced by nothing.** When the
# crates landed, none of them was: `net.rs` named one type from each and
# stopped, `lto = "fat"` below is whole-program over the dependency rlibs, and
# Rust code nothing reaches is not in the archive — measured on
# aarch64-apple-darwin at the commit that added `net`, twenty-four bytes for the
# lot. Five have since been reached, each in the commit that needed it:
# `tokio` by `rt.rs`, the carrier runtime whose reactor and timer wheel
# `Clock::sleepMillis` and `Net::fetch` wait on (+185 424 bytes); `rustls`
# and `ring` by `tls.rs`, which `http.rs` calls for every `https://` URL
# (+1 804 592); `hyper` by `net.rs`'s HTTP/2 acceptor (+771 688, which is
# the server, `h2`, `tokio-util` and HPACK's tables); and `tungstenite` by
# `net.rs`'s WebSocket half (+77 360, which is small because `http` and
# `httparse` were already live for hyper's sake, so what arrived is the framing,
# the masking and one SHA-1). `quinn` is reached by nothing still.
# `cli/tests/ci.rs::the_runtime_archive_is_real` is where all of that is asserted
# rather than assumed: five names its symbol table must carry, one it must
# not.
#
# ## The provider, and what it costs
#
# `rustls` has no cryptography of its own; it takes a `CryptoProvider`, and
# C2 landed the crate with **none** so that the price could be paid where the
# capability is bought rather than where the dependency is added. This is that
# slice, and the bill, measured on aarch64-apple-darwin:
#
#   net off (no dependency tree at all)              6 304 448 bytes
#   net on (the reactor, TLS, and HTTP/2 since F4)   8 970 592   +2 666 144
#   net-h3 on as well                                8 971 008         +416
#
# Re-measured on the same host by F7, which linked the fifth crate:
#
#   net off                                             6 322 696 bytes
#   net on, since F7 linked the WebSocket framing        9 090 776   +2 768 080
#   net-h3 on as well                                    9 091 024         +248
#
# TLS was **1.72 MiB** of that, of which 845 064 bytes is `ring`'s **native**
# object code — C and AArch64 assembly in twenty-five `.o` members that `rustc`
# bundles into a `staticlib` whether the linker needs them or not, so
# `lto = "fat"` cannot touch them. `curve25519.o` alone is 405 KB and
# `p256-nistz.o` is 173 KB. That total put the archive **over** the 7 MiB budget
# `cli/tests/ci.rs::the_runtime_archive_is_real` carried, by about 505 KB, and the
# budget was re-measured and re-stated there in C7's commit — the ratchet
# working as written rather than being quietly widened. HTTP/2 added 771 688 on
# top in F4 and WebSockets 77 360 on top of that in F7, and the Darwin budget
# did **not** move either time, because 9 090 776 is still under the 9 MiB the
# re-statement set: a ratchet that moves when it has not been hit is not one.
# What is left of the margin is **3.7 %**, and the script says in as many words
# that the next slice to add anything should expect to be the one that
# re-measures it.
#
# **The Linux budget did move, and it moved because it had never been
# measured.** Every figure that script carried for Linux was the macOS delta
# added to a number taken before any of these crates was linked. The first real
# measurement (aarch64-unknown-linux-gnu, in the Linux container
# BUILD-AND-WATCH.md §3.3.1 describes) put the archive at 12 407 786 bytes *before* HTTP/2 and 13 611 228
# after — so Linux had been at 98.6 % of a 12 MiB budget for two slices, and
# hyper's 1 203 442 bytes are what took it over. That delta is 1.56x the Darwin
# one against an archive that is already 1.51x as large, which is ELF's price
# for the same code rather than anything failing to be stripped. 14 MiB is the
# re-measurement.
#
# `ring` rather than `aws-lc-rs`, the other provider `rustls` ships: `aws-lc-rs`
# needs `cmake` (and, on some hosts, `bindgen`) at build time, which is a second
# tool to require of `cargo install buri` and a second way for the runtime build
# to break. `ring` needs a C compiler, which the toolchain already requires for
# the stencil library and which `build/link.rs` already shells out to for every
# native artifact — and `cli/build.rs` probes for it and falls back to
# `--no-default-features` with a warning when it is missing, so the third clause
# of the bar ("degrades rather than breaks") still holds on a host with no `cc`.
#
# The pure-Rust providers were considered and are not here: `rustls-rustcrypto`
# says of itself that it is unaudited and not for production use, and a TLS
# stack in every binary this compiler produces is the last place to accept that.
#
# One line each, deliberately: `dependencies_stay_behind_the_bar` reads this
# file with a hand-rolled line scanner rather than a TOML crate — a test that
# needed a crate to check that the crates are the agreed ones would be its own
# counterexample — so "a dependency is a line" is a property this file owes it.
[dependencies]
tokio = { version = "1", optional = true, default-features = false, features = ["rt-multi-thread", "net", "time", "io-util", "sync"] }
hyper = { version = "1", optional = true, default-features = false, features = ["client", "server", "http1", "http2"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["std", "tls12", "ring"] }
ring = { version = "0.17", optional = true, default-features = false }
tungstenite = { version = "0.30", optional = true, default-features = false, features = ["handshake"] }
quinn = { version = "0.11", optional = true, default-features = false, features = ["rustls-ring", "runtime-tokio"] }
getrandom = { version = "0.4", optional = true, default-features = false }

# Three features. Two of them are on and one is off, and the split is the whole
# of the argument here: a feature is in `default` when turning it off costs a
# *language capability* a user did not choose to do without, and out of it when
# turning it on is a choice somebody has to make on purpose.
#
# `net` is on, and the default is the point: a `cargo install buri` gets a
# toolchain whose runtime *can* speak the network, because a toolchain that
# could not would make `Net` a build-flag question for every user rather than a
# capability question for every program.
#
# Off, the five crates it names resolve to nothing, the archive is the one this
# repository had before the feature existed, and `https://` goes back to the
# refusal `http.rs` writes for it — which names this feature, because with the
# feature off it is the true reason. `cli/build.rs` reads `BURI_RUNTIME_NET=0`
# and passes `--no-default-features`, which is how the numbers above were
# measured, what a host that cannot fetch a dependency tree can fall back to by
# hand, and what a host with no C compiler gets automatically.
#
# ## `net-h3`, which is off, and stays off until the crate is trusted
#
# HTTP/3 is behind its own feature and that feature is **not** in `default`.
# The concurrency note gated h3 behind configuration "until the crate is
# trusted", and a cargo feature is what that gate is: `quinn` is a QUIC
# implementation — a transport protocol with congestion control, loss recovery
# and its own packet cryptography, reached from the network by anything that
# can send a UDP datagram — and this archive is linked into every native binary
# this compiler produces. `net`'s five earn their default by being what a
# program that speaks the network at all needs; `quinn` is what a program that
# has *asked for HTTP/3* needs, and asking is the difference.
#
# So the default toolchain carries no QUIC code and `serve` answers `.Http3`
# with an `.Err(Unsupported)` — a value, not an abort — while a toolchain built
# with `BURI_RUNTIME_NET_H3=1` carries it and does not. `cli/runtime/net.rs`
# holds both halves: the capability bit, the `buri_rt_net_h3_available` door a
# linked program asks through, and `net::serves`, the one line F2's `serve`
# calls. `libburi_rt.a.features` gains a second line and `runtime_native::h3()`
# reads it, which is the same mechanism `net` already uses rather than a new
# one.
#
# **`net-h3` implies `net`**, and that is a dependency rather than a
# convenience: QUIC carries TLS 1.3 inside the transport, so `quinn` is built
# on `rustls`, and it wants the same reactor `rt.rs` already holds. A `net-h3`
# without `net` would be a QUIC stack with no crypto provider and nowhere to
# run.
#
# **The provider is `ring`, deliberately and by name.** `quinn`'s own defaults
# are `rustls-aws-lc-rs` and `platform-verifier`; both are turned off here and
# `rustls-ring` is turned on, so the h3 archive has exactly one cryptography
# implementation in it rather than two. `the_runtime_archive_is_real` greps for
# `aws_lc` on every leg, h3 included, which is what keeps that true when
# `quinn`'s defaults next change.
#
# ## `crypto`, which is on for `net`'s reason and is otherwise unlike it
#
# `crypto` is in `default` and the argument is `net`'s, word for word: a
# toolchain whose runtime cannot answer `Entropy` would make "can this program
# mint a session token" a build-flag question for every user rather than a
# capability question for every program, and the answer for the overwhelming
# majority of them would be yes.
#
# What is unlike `net` is what it costs to have it: one crate, no C compiler,
# no native object files, and a few kilobytes of archive. `net` is on by
# default despite costing 2.7 MB; this is on by default and costs almost
# nothing, so the interesting half of the decision is the *other* direction —
# what a `crypto`-off toolchain owes a program.
#
# It owes it a refusal at compile time, and that is why the feature exists at
# all rather than a fallback existing. `cli/build.rs` reads
# `BURI_RUNTIME_CRYPTO=0`, the archive is built without `getrandom`, the
# `buri_rt_host_entropy_bytes` symbol is not in it, and
# `backend::cryptography_gap` refuses the program by name before code
# generation — `cryptography-not-available`, whose page says to get a different
# toolchain rather than to edit the program. The one thing a runtime without a
# cryptographic generator must never do is answer anyway from a weaker one: an
# `Entropy` served by `rng.rs`'s xoshiro would be indistinguishable from the
# real thing at every point except the one that matters.
[features]
default = ["net", "crypto"]
net = ["dep:tokio", "dep:hyper", "dep:rustls", "dep:ring", "dep:tungstenite"]
net-h3 = ["net", "dep:quinn"]
crypto = ["dep:getrandom"]

# The flags that used to be spelled out in `cli/build.rs`'s `rustc` command
# line, in the one place a `cargo build --release` reads them from. Each is a
# decision rather than a default:
#
# * `lto = "fat"` is a **size** decision, not a speed one, and the size is
#   embedded in every `buri` binary: measured on aarch64-apple-darwin, 17.7 MB
#   without it and 6.0 MB with, for about 2.6 seconds of build time once per
#   toolchain build. It is whole-program across the runtime, the copy of `std`
#   a staticlib bundles, *and* the dependency rlibs,
#   which is what made an unreferenced networking stack cost twenty-four
#   bytes instead of a megabyte, and what still holds `quinn` out of it.
# * `panic = "abort"` because an abort in this language is a write to standard
#   error and an exit, never an unwind (SPEC 6.9), so the unwinder tables
#   would be dead weight in every artifact.
# * `codegen-units = 1` and `debug = 0` are reproducibility and size: one unit
#   removes the parallel-codegen non-determinism that `--check-reproducible`
#   would otherwise catch as a byte difference between two builds of the same
#   tree, and there is no debugger that steps into this archive.
# * `strip = "none"` pins what Cargo would otherwise infer from `debug = 0`,
#   which is `strip = "debuginfo"`. There is no debug info to strip, so it
#   changes nothing about the archive's contents — it is pinned so that a
#   Cargo whose inference changes cannot silently change the archive's bytes.
#
# `opt-level = 3` is `release`'s own default and is left to it.
[profile.release]
lto = "fat"
panic = "abort"
codegen-units = 1
debug = 0
strip = "none"

# Its own workspace root. The assembled package lands under `target/`, which is
# inside the toolchain's own workspace directory, so without this table Cargo
# would walk up from `$OUT_DIR/rt-pkg` and attach the runtime to the workspace
# it must not be part of — taking the workspace's `[profile.release]` with it
# and reaching for a target-dir lock the outer `cargo` is holding.
[workspace]
