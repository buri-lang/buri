# The runtime's painter: `paint.rs` and `snapshot.rs`, as a crate of its own.
#
# `cli/build.rs` assembles this file as `paint/Cargo.toml` beside the
# archive's `Cargo.toml`, as it does `core.toml`. Only a program that takes a
# snapshot names the painter, so only that program's link loads it and the
# three crates below (`design/PERFORMANCE.md` §6.143). `manifest.toml`
# argues each crate.
[package]
name = "buri-rt-paint"
version = "0.3.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
name = "buri_rt_paint"
path = "../painter.rs"

[dependencies]
buri-rt-core = { path = "../core", default-features = false }
taffy = { version = "=0.14.0", optional = true, default-features = false, features = ["std", "taffy_tree", "flexbox", "grid"] }
cosmic-text = { version = "=0.19.0", optional = true, default-features = false, features = ["std", "swash"] }
tiny-skia = { version = "=0.12.0", optional = true, default-features = false, features = ["std", "simd"] }

# Chosen by `manifest.toml`'s `paint`, which turns this on.
[features]
paint = ["dep:taffy", "dep:cosmic-text", "dep:tiny-skia"]
