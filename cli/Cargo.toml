[package]
name = "buri"
version = "0.3.0"
edition = "2021"
description = "The Buri toolchain: compiler, build system, test runner, formatter, and linter."
license = "MIT"
repository = "https://github.com/buri-lang/buri"
# The crate's page on docs.rs and crates.io is the root `README.md` itself, so
# that it shows the introduction a reader meets on GitHub rather than a second
# copy of it.
readme = "../README.md"
# The toolchain's own code wants 1.87, for `is_multiple_of` in the stencil
# backend's ELF and region writers. Clippy's `incompatible_msrv` is what holds
# this number to the tree rather than to a memory of it: raise a use above the
# floor and `cargo clippy --all-targets` names the line.
rust-version = "1.87"

# `benches/generate.rs` and `benches/corpus.rs` are *modules* of the `compiler`
# bench target, not bench targets. Cargo infers a target from every `.rs` file
# directly under `benches/`, so without this a plain `cargo bench -p buri`
# builds two more binaries that have no `main` and measure nothing. The
# `[[bench]]` stanza at the bottom of this file names the one real target.
autobenches = false

# The dependency bar is stated in the workspace manifest, and `inkwell` is the
# only thing that clears it. It is optional, so the *default* build has no
# dependency at all and `cargo build -p buri --no-default-features` resolves
# nothing either.
#
# It carries its version into `Backend::identity()`'s cache keys, so a bump
# invalidates every cached release object in every repository — an event to
# schedule rather than to inherit (design/native/BUILD-AND-WATCH.md §2, §7).
[dependencies]

# -- backend-llvm -------------------------------------------------------------
#
# LLVM 21.1, inkwell 0.10, `llvm-sys` 211.x, `LLVM_SYS_211_PREFIX`
# (CODEGEN-LLVM.md §8). 21 rather than the newest inkwell supports because the
# flake's pinned `nixos-25.05` has no LLVM 22, and pinning one would mean
# bumping the whole toolchain's nixpkgs in service of a codegen decision.
#
# The linking mode is target-gated, which is why this is two entries rather than
# one. `llvm-sys` defaults to `prefer-static` since 191, and on macOS
# `llvm-config --system-libs --link-static` mixes Homebrew static archives with
# shared libraries and its `build.rs` panics ("Shared library should be a .so
# file", llvm-sys GitLab #80). The mode must be selected *through inkwell* — a
# bare `llvm-sys` feature makes Cargo try to resolve every LLVM version at once.
#
# CODEGEN-LLVM.md §8 also asks for `llvm-sys`'s `strict-versioning`, and it is
# not here: inkwell's `llvm21-1` expands to `llvm-sys-211` and nothing else, so
# reaching that flag would mean a *second* direct dependency on `llvm-sys` —
# which is another entry against the bar above, for a flag. What it would buy is
# a build failure instead of a silent substitution on a machine carrying LLVM
# 22; what already stands in for it is `Backend::identity()`, which puts the
# LLVM version in every release `codegen` key, so two toolchains built against
# different LLVMs do not share cached objects. BUILD-AND-WATCH.md §3.4 says so
# where a contributor will read it.
[target.'cfg(target_os = "macos")'.dependencies]
inkwell = { version = "0.10", optional = true, features = ["llvm21-1-prefer-dynamic"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
inkwell = { version = "0.10", optional = true, features = ["llvm21-1"] }

[features]
default = ["backend-stencil"]

# On by default, and off on a host with no `clang`. See `cli/build.rs`. It is
# the whole of the default toolchain's native code generation and it needs no
# crate, which is why the default build has no dependency at all.
backend-stencil = []

# Off by default. It needs LLVM 21 installed and `LLVM_SYS_211_PREFIX` set, and
# `cargo install buri` must not require that. A toolchain without it refuses a
# native `--release` build naming this feature rather than falling back to the
# development backend.
backend-llvm = ["dep:inkwell"]

# The benchmark's counting global allocator. Off by default and not referenced
# by the library at all: the counter is two atomic increments on every
# allocation in the process, so a timed row taken with it on is not comparable
# with one taken without it. `benches/compiler.rs --alloc` reads it, and the
# figure it produces — allocations per line, per phase — is the one number in
# the whole benchmark with no measurement noise in it.
alloc-counter = []

# The panic-free lint set, in the workspace manifest with the reasoning.
[lints]
workspace = true

[lib]
name = "buri"
path = "src/lib.rs"

[[bin]]
name = "buri"
path = "src/main.rs"

# The compiler throughput benchmark. `design/PERFORMANCE.md` states the three
# goals it measures against and the methodology it implements.
#
# `harness = false` because there is no benchmark harness to link: `criterion`
# is not admissible under the dependency bar in the workspace manifest — it is
# neither a code generator nor a platform interface — and what a harness has to
# do here is warm up, repeat, and report a median with its spread, which is a
# hundred and fifty lines. The target owns its own `main`, and takes its own
# flags: `--json`, `--quick`, `--validate`, `--split`.
#
# `cargo bench` builds this under `[profile.bench]`, which inherits
# `[profile.release]` — opt-level 3, LTO, one codegen unit. The
# `[profile.test] opt-level = 1` in the workspace manifest does *not* reach it:
# that profile applies to test targets, and a bench target is not one. The
# header the benchmark prints says which build it is, so a number taken from an
# unoptimized binary announces itself rather than being quietly filed.
[[bench]]
name = "compiler"
path = "benches/compiler.rs"
harness = false
