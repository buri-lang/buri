// One schema importing another: this is the imported one.
//
// `Country` is here rather than in demo.proto so that the enum a field names
// and the message a field holds both cross a file boundary.

syntax = "proto3";

package conformance.proto.v1;

enum Country {
  COUNTRY_UNSPECIFIED = 0;
  UK = 1;
  JP = 81;
}

message Address {
  string city = 1;
  int32 zip = 2;
  Country country = 3;
}
