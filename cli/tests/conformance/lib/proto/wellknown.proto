// Every well-known type as a field. The schemas are the toolchain's own: no
// file here declares `google.protobuf`, and the imports still resolve.

edition = "2026";

package conformance.proto.v1;

import "google/protobuf/any.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

message Known {
  google.protobuf.Duration duration = 1;
  google.protobuf.Timestamp timestamp = 2;
  google.protobuf.FieldMask mask = 3;
  google.protobuf.Struct object = 4;
  google.protobuf.Value value = 5;
  google.protobuf.ListValue list = 6;
  google.protobuf.Int64Value big = 7;
  google.protobuf.UInt64Value huge = 8;
  google.protobuf.BoolValue flag = 9;
  google.protobuf.StringValue text = 10;
  google.protobuf.BytesValue blob = 11;
  google.protobuf.DoubleValue ratio = 12;
  google.protobuf.FloatValue rough = 13;
  google.protobuf.Int32Value small = 14;
  google.protobuf.UInt32Value count = 15;
  google.protobuf.Empty nothing = 16;
  google.protobuf.Any any = 17;
  google.protobuf.NullValue none_value = 18;
  repeated google.protobuf.Timestamp times = 19;
  repeated google.protobuf.Value values = 20;
}

// `Known` again, one level down, so a refusal names where it was.
message Envelope {
  Known known = 1;
  repeated Known many = 2;
  map<string, google.protobuf.Duration> spans = 3;
  oneof pick {
    google.protobuf.Timestamp at = 4;
  }
}
