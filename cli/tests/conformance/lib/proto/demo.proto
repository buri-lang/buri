// One message of every field kind editions has, so that a change to the mapping
// fails an assertion rather than a review.
//
// The field numbers are deliberately not consecutive: a tag is the number, not
// the position, and a corpus where the two agree cannot tell them apart.

edition = "2026";

package conformance.proto.v1;

// An import is written from the repository root, the way protoc resolves one
// against `-I.`.
import "lib/proto/address.proto";

// Enums are open, which is edition 2026's default: nothing here names 7, and a
// message carrying that number decodes to `Shade.Unrecognized(7)` rather than
// losing it.
enum Shade {
  SHADE_UNSPECIFIED = 0;
  LIGHT = 1;
  DARK = 2;
}

message Everything {
  // Explicit presence, which is the edition's default: each of these is an
  // `Option`, and one set to its zero value is still on the wire.
  string name = 1;
  int32 count = 2;
  int64 total = 3;
  uint32 small = 4;
  uint64 large = 5;
  sint32 delta = 6;
  sint64 offset = 7;
  fixed32 tag_id = 8;
  fixed64 serial = 9;
  sfixed32 signed_small = 10;
  sfixed64 signed_big = 11;
  bool active = 12;
  bytes blob = 13;
  double ratio = 14;
  float rough = 15;
  Shade shade = 16;

  // Implicit presence, asked for by name: these two are bare types, and a
  // value equal to the default is indistinguishable from an absent one — which
  // is what a proto3 singular field was.
  int32 age = 20 [features.field_presence = IMPLICIT];
  string nickname = 21 [features.field_presence = IMPLICIT];

  // Expanded rather than packed, which is the other feature with teeth.
  repeated int32 spread = 34 [features.repeated_field_encoding = EXPANDED];

  // Repeated: packed for the numeric ones, one field each for the rest.
  repeated int32 scores = 30;
  repeated string labels = 31;
  repeated Address places = 32;
  repeated Shade shades = 33;

  // A message field, which always tracks presence.
  Address home = 40;

  // Nesting, which flattens to Everything_Note.
  message Note {
    string text = 1;
  }

  Note note = 41;

  // A field whose name is a Buri keyword, and one that is snake_case.
  string type = 50;
  string user_name = 51;

  oneof contact {
    string phone = 60;
    Address office = 61;
    int64 extension_number = 62;
  }
}

// A message with nothing in it: the degenerate case both codecs have to hold.
message Empty {}
