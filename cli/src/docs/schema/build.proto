// The normative schema for `BUILD.buri`. The root `REPO.buri` has its own
// schema in repo.proto.
//
// `BUILD.buri` is textproto and parses as `buri.build.v1.BuildFile`. It is not a
// program: there is no expression language, no glob, no macro, and no import. A
// build file is data, and reading it is the whole of understanding what it
// declares.
//
// The tool parses these with the same .proto reader the language uses for
// `from "//proto/foo.proto" import ...`, so an unknown field is an error with a
// line number rather than a silent no-op.
//
// `buri gen` rewrites only the fields it can derive from the sources —
// `sources`, `proto_sources`, `dependencies`, and their `test`/`testing`
// counterparts. It may
// reformat the file as `buri format` would, but the *contents* of the
// hand-authored fields survive: `tags`, `platforms`, and `timeout_seconds`
// above all, and `visibility` and `outputs` with them. See CLI.md.

syntax = "proto3";

package buri.build.v1;

// A directory containing a BUILD.buri file is a *package*. Files in
// subdirectories that do not themselves contain a BUILD.buri belong to the
// nearest ancestor package.
//
// A package declares at most one library and at most one binary. That is what
// makes `//lib/money` an unambiguous name for a directory, a library, and the
// module `lib/money/lib.buri` all at once, and it is why no label in this
// schema has a `:target` suffix.
message BuildFile {
  // The library rooted at this package's `lib.buri`.
  Library library = 1;

  // The binary rooted at this package's `main.buri`.
  Binary binary = 2;
}

// A `library` requires `lib.buri` in the package directory. That file is the
// library's entire public surface: a target depending on this library can
// import exactly the names `lib.buri` exports, and nothing else.
//
// There is no `name` field. A package holds at most one library, so the rule
// kind and the package path already identify it: this library is `//lib/money`
// in every context that can refer to it, and diagnostics say so. A name field
// would be a second identifier for the same target, free to disagree with the
// first.
message Library {
  // Every .buri file in this package that belongs to this library, EXCLUDING
  // `lib.buri` and the test sources. Package-relative, may descend into
  // subdirectories. No globs: a file that exists on disk but appears in no rule
  // is a build error, not a silently ignored file.
  repeated string sources = 1;

  // Every .proto file in this package that belongs to this library. Each one
  // becomes a module named by its own path — `//lib/money/rates.proto` — holding
  // the types the schema declares and their four codecs. The module is internal
  // to the rule exactly as a .buri source is, so `lib.buri` decides which of the
  // generated names leave the library. See PROTO.md.
  //
  // Package-relative, may descend into subdirectories, no globs. `buri gen`
  // manages this field the way it manages `sources`.
  repeated string proto_sources = 8;

  // Labels of libraries this one may use. `core/*` ships with the toolchain and
  // is never listed. Cycles are an error. A library is *used* by importing it
  // or by calling a method that resolves into it, and both require the entry.
  repeated string dependencies = 2;

  // Labels drawn from the vocabulary REPO.buri declares. A tag is a fact about
  // this library, not a constraint: the constraints live on the tag
  // declaration. Tags mean the same thing on a library and on a binary.
  //
  // Every entry must name a `tag` block in REPO.buri. An undeclared tag is an
  // error, never a no-op — a tag that silently means nothing is a policy that
  // silently is not enforced, and `tags: ["sever"]` should not be the quiet
  // difference between a checked build and an unchecked one. See TAGS.md.
  repeated string tags = 3;

  // The platforms this library can be built for. Unset means all of them, which
  // is the common case — set this only for code that is genuinely
  // platform-specific. A whitelist rather than an exclusion, so adding a
  // platform to the toolchain never silently widens a library written before it
  // existed.
  repeated Platform platforms = 4;

  // Who may depend on this library. See VISIBILITY in BUILD-FILES.md.
  repeated string visibility = 5;

  // Tests that exercise this library through `lib.buri`.
  TestSuite test = 6;

  // The library's utilities for testing it — fakes, fixtures, matchers —
  // rooted at `testing/lib.buri`. Required when that file exists, and may be
  // empty. Importable as `//lib/money/testing`, and only from a test source,
  // because the path contains a `testing` segment. Never linked into a
  // production artifact.
  TestingSurface testing = 7;
}

message TestingSurface {
  // Every .buri file under `testing/` other than `testing/lib.buri`.
  repeated string sources = 1;

  // Libraries these modules use, beyond the library's own `dependencies`. A fake often
  // needs less than the real thing, and occasionally something else entirely.
  repeated string dependencies = 2;
}

// A `binary` requires `main.buri` in the package directory, and that file must
// export `main`. `main.buri` is the binary's surface for tests, the same way
// `lib.buri` is a library's surface for dependents.
//
// No `name` field, for the same reason a library has none: a package holds at
// most one binary, so `//cmd/server` names it. The artifact filename defaults
// to the package's directory name; `Output.artifact_name` overrides it.
message Binary {
  // Every .buri file in this package that belongs to the binary rather than to
  // a co-located library, excluding `main.buri` and the test sources.
  repeated string sources = 1;

  // Exactly the same meaning as on a library.
  repeated string proto_sources = 6;

  repeated string dependencies = 2;

  // Exactly the same meaning as on a library: labels this target carries. A
  // binary has no `platforms` field — its `outputs` already say which platforms
  // it is built for.
  repeated string tags = 3;

  // What to produce. One artifact per entry, and the whole graph is checked
  // once per entry, because each entry names a different platform.
  repeated Output outputs = 4;

  // Tests that exercise this binary through `main.buri`.
  TestSuite test = 5;
}

message Output {
  // The platform this artifact is built for. Every library in the transitive
  // closure that declares `platforms` must admit it.
  Platform platform = 1;

  // Ignored, and must be unset, when platform is JS or WEB.
  Arch arch = 2;

  // Artifact filename. Defaults to the package's directory name (plus `.mjs`
  // for JS and WEB).
  string artifact_name = 3;

  // Rejected when platform is WEB: a page is always an ES module, which is
  // what a browser's `<script type="module">` loads.
  JsOptions js = 4;
}

// A platform is the set of effects its host exports, which is why WEB is one
// of these and not a mode of JS. Both emit the same JavaScript; they differ in
// what `core/host` grants, and that difference is checked per output when
// `main` builds its context.
enum Platform {
  PLATFORM_UNSPECIFIED = 0;
  LINUX = 1;
  MACOS = 2;
  JS = 3;
  // A page in a browser: an `.mjs`, a `.css`, and an `.html` entry shell that
  // loads them. Grants the reactive graph (`Ui`, `Watch`) and the
  // non-blocking request shape (`Fetch`); grants no filesystem, socket,
  // standard input, environment or process to exit.
  WEB = 4;
}

enum Arch {
  ARCH_UNSPECIFIED = 0;
  X86_64 = 1;
  ARM64 = 2;
}

message JsOptions {
  Module module = 1;

  enum Module {
    MODULE_UNSPECIFIED = 0;  // ESM
    ESM = 1;
    CJS = 2;
  }
}

// Tests live in the package's `test/` directory and are declared here. A test
// source imports the target under test by its label — `//lib/money` for a
// library, `//lib/money/main` for a binary — which is what confines a test to
// the target's public surface.
message TestSuite {
  // Package-relative paths, conventionally under `test/`.
  repeated string sources = 1;

  // Libraries available to the test sources in addition to the target's own
  // `dependencies`. Fakes, fixtures, golden-file helpers.
  repeated string dependencies = 2;

  // Files the test may read through the runner's in-memory `Fs`, rooted at the
  // package directory. Nothing else on disk is visible. `buri test --accept`
  // rewrites these in the source tree; see HERMETICITY-AND-CACHING.md.
  repeated string data = 3;

  // Wall-clock ceiling per test declaration. Unset means the runner's built-in
  // default. There is no repository-wide setting: a suite that needs longer
  // says so where someone reading it will see it.
  uint32 timeout_seconds = 4;

  // Platforms to run this suite on — one run per entry. Unset means one run, on
  // the host platform. The suite inherits the target's tags either way.
  repeated Platform platforms = 5;
}
