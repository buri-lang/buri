// The normative schema for `REPO.buri`, the one file at the repository root.
//
// `REPO.buri` is textproto and parses as `buri.build.v1.RepoConfig`. Like
// `BUILD.buri` it is data: no expression language, no glob, no macro, no
// import. Its presence is what makes a directory a repository root.
//
// It is deliberately small. Two things belong here — the tag vocabulary every
// build file draws from, and how hard the lint catalogue is run — and
// everything else that might want to live in a repository-wide config file is
// either a flag on the command or a field on a rule. See REPO-CONFIG.md for
// what is absent and why.

syntax = "proto3";

package buri.build.v1;

// `Platform` is declared alongside the rules that select one.
import "build.proto";

message RepoConfig {
  // Field 1 was `toolchain`, an exact compiler version and the SHA-256 of the
  // compiler that had to build this repository. It was removed: a pin only
  // means something where a toolchain is fetched, and nothing fetches one.
  // Reserved rather than reused, so that an old `REPO.buri` cannot be read as
  // something else.
  reserved 1;

  // The whole tag vocabulary, and the whole of build policy. See `buri docs build/tags`.
  repeated Tag tag = 2;

  // How hard the lint catalogue is run here. One block, or none.
  Lint lint = 3;
}

// Where the lint catalogue runs, and what a finding costs.
//
// Both fields default to false, and false for both is exactly the behaviour of
// a `REPO.buri` with no `lint` block at all: the catalogue runs when `buri
// lint` is asked to run it, and what it finds is a warning. So the block is
// worth writing only to say yes to something.
//
// That is the shape of the whole message, and the reason it can be read
// quickly: every field here is a ratchet. Each one may only make the toolchain
// stricter — run the checks in more places, or make a finding cost more. There
// is no field that turns a check off, exempts a directory, or downgrades a
// finding, and there is not going to be one. A repository may hold itself to
// more than the catalogue asks. It may not hold itself to less.
message Lint {
  // Whether `buri build` and `buri test` run the lint catalogue too and report
  // what it finds, rather than leaving that to `buri lint`.
  bool check_during_build = 1;

  // Whether a finding is an error, and so fails whichever command reported it.
  // False leaves findings as warnings that are printed and change no exit code
  // — everywhere except `buri lint` itself, which exits nonzero on a finding
  // either way, because running the linter is already the request to be told.
  bool fail_on_finding = 2;
}

// A label a target may carry, and the policy attached to carrying it. Tags form
// one flat namespace: `tags: ["server"]` in a build file three directories down
// resolves here and nowhere else, so a name declared twice is rejected — and a
// name declared nowhere is rejected too. A `tags` entry naming no block in this
// file is an error, not a tag that quietly means nothing.
message Tag {
  // Lowercase identifier: `server`, `experimental`, `pii`.
  string name = 1;

  // Why this tag exists. Printed in the diagnostic when this tag is what rules
  // a target out, so write the policy, not a restatement of the name.
  string doc = 2;

  // What carrying this tag rules out.
  Forbids forbids = 3;

  // What carrying this tag demands.
  Requires requires = 4;

  message Forbids {
    // Tags that may not appear anywhere in the same dependency closure as this
    // one. Symmetric: declaring `server` forbids `client` is the same statement
    // as the reverse, so write it once, on whichever tag makes it easier to
    // find.
    //
    // This one field replaces what were separate mechanisms for "where may this
    // code go" and "what is in this binary". Both are reachability questions,
    // and reachability does not have a direction.
    repeated string tags = 1;

    // There is deliberately no `platforms` here. A platform restriction is
    // always written as a whitelist under `requires`, so that adding a platform
    // to the toolchain cannot silently widen code written before it existed.
    // "Not JS" would not survive the arrival of WASM; "linux and macos" does.
  }

  message Requires {
    // The only platforms code carrying this tag may be built for. Unset means
    // all of them. Same meaning as `Library.platforms` — this is where it goes
    // when the restriction is policy spanning many libraries rather than a fact
    // about one of them.
    repeated Platform platforms = 1;

    // There is deliberately no `tags` here. Requiring that every dependency
    // also carry this tag would be unusable: carrying no tags at all is the
    // common case, so such a rule would force the tag onto every library in the
    // repository transitively. Weakened to "no dependency may carry something
    // incompatible", it is exactly `Forbids.tags`.
  }
}
