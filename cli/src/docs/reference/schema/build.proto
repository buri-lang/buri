// The normative schema for `BUILD.buri`. The root `REPO.buri` has its own
// schema in repo.proto.
//
// `BUILD.buri` is textproto and parses as `buri.build.v1.BuildFile`. It is not a
// program: there is no expression language, no glob, no macro, and no import. A
// build file is data, and reading it is the whole of understanding what it
// declares.
//
// The tool parses these with the same .proto reader the language uses for
// `from "//proto/foo.proto" import ...`, so an unknown field is an error with a
// line number rather than a silent no-op.
//
// `buri gen` rewrites only the fields it can derive from the sources —
// `sources`, `dependencies`, and their `test`/`testing` counterparts. It may
// reformat the file as `buri format` would, but the *contents* of the
// hand-authored fields survive: `tags`, `backends`, `platforms`, and
// `timeout_seconds` above all, and `visibility`, `outputs` and `generators`
// with them. It leaves a `platform` rule as written. See CLI.md.

syntax = "proto3";

package buri.build.v1;

// A directory containing a BUILD.buri file is a *package*. Files in
// subdirectories that do not themselves contain a BUILD.buri belong to the
// nearest ancestor package.
//
// A package declares at most one library, one binary, one tool and one
// platform. That is
// what makes `//lib/money` an unambiguous name for a directory, a library, and
// the module `lib/money/lib.buri` all at once, and it is why no label in this
// schema has a `:target` suffix.
message BuildFile {
  // The library rooted at this package's `lib.buri`.
  Library library = 1;

  // The binary rooted at this package's `main.buri`.
  Binary binary = 2;

  // The tool rooted at this package's `tool.buri`.
  Tool tool = 3;

  // A platform outputs can be built for. Lives under the repository's
  // top-level `platform/` directory, outside `platform/effect/`.
  Platform platform = 4;
}

// A `library` requires `lib.buri` in the package directory. That file is the
// library's entire public surface: a target depending on this library can
// import exactly the names `lib.buri` exports, and nothing else.
//
// There is no `name` field. A package holds at most one library, so the rule
// kind and the package path already identify it: this library is `//lib/money`
// in every context that can refer to it, and diagnostics say so. A name field
// would be a second identifier for the same target, free to disagree with the
// first.
message Library {
  // Every .buri file in this package that belongs to this library, EXCLUDING
  // `lib.buri` and the test sources. Package-relative, may descend into
  // subdirectories. No globs: a file that exists on disk but appears in no rule
  // is a build error, not a silently ignored file.
  repeated string sources = 1;

  // Field 8 was `proto_sources` — the .proto schemas this rule owned, each
  // becoming a module. Retired: it was a generator the build could not name,
  // running one program on one language, so a repository wanting a second kind
  // of generated code had no way to ask. A schema is a generator's input now,
  // handed to the `proto` tool through `generators`. The number is not
  // reused.
  reserved 8;
  reserved "proto_sources";

  // The generators this rule runs. Each one is a program the build executes,
  // and every module it hands back belongs to this rule exactly as a .buri
  // source does — internal to it, so `lib.buri` decides which of the generated
  // names leave the library.
  //
  // Hand-authored, like `visibility` and `outputs`. `buri gen` cannot know
  // which generator owns a file, so it never writes this field and never
  // touches an entry's `inputs`.
  repeated Generator generators = 9;

  // Labels of libraries this one may use. `core/*` ships with the toolchain and
  // is never listed. Cycles are an error. A library is *used* by importing it
  // or by calling a method that resolves into it, and both require the entry.
  repeated string dependencies = 2;

  // Labels drawn from the vocabulary REPO.buri declares. A tag is a fact about
  // this library, not a constraint: the constraints live on the tag
  // declaration. Tags mean the same thing on a library and on a binary.
  //
  // Every entry must name a `tag` block in REPO.buri. An undeclared tag is an
  // error, never a no-op — a tag that silently means nothing is a policy that
  // silently is not enforced, and `tags: ["sever"]` should not be the quiet
  // difference between a checked build and an unchecked one. See `buri docs build/tags`.
  repeated string tags = 3;

  // The backends this library can be built with. Unset means both. Set it only
  // for code that relies on one backend's behaviour.
  repeated Backend backends = 10;

  // The platforms this library can be built for: `"native"`, `"node"` or
  // `"web"`. Unset means all of them. Set it only for code that means
  // something on one platform. With `backends` too, a platform must satisfy
  // both.
  repeated string platforms = 4;

  // Who may depend on this library. See VISIBILITY in BUILD-FILES.md.
  repeated string visibility = 5;

  // Tests that exercise this library through `lib.buri`.
  TestSuite test = 6;

  // The library's utilities for testing it — fakes, fixtures, matchers —
  // rooted at `testing/lib.buri`. Required when that file exists, and may be
  // empty. Importable as `//lib/money/testing`, and only from a test source,
  // because the path contains a `testing` segment. Never linked into a
  // production artifact.
  TestingSurface testing = 7;
}

message TestingSurface {
  // Every .buri file under `testing/` other than `testing/lib.buri`.
  repeated string sources = 1;

  // Libraries these modules use, beyond the library's own `dependencies`. A fake often
  // needs less than the real thing, and occasionally something else entirely.
  repeated string dependencies = 2;
}

// A `binary` requires `main.buri` in the package directory, and that file must
// export `main`. `main.buri` is the binary's surface for tests, the same way
// `lib.buri` is a library's surface for dependents.
//
// No `name` field, for the same reason a library has none: a package holds at
// most one binary, so `//cmd/server` names it. The artifact filename defaults
// to the package's directory name; `Output.artifact_name` overrides it.
message Binary {
  // Every .buri file in this package that belongs to the binary rather than to
  // a co-located library, excluding `main.buri` and the test sources.
  repeated string sources = 1;

  // Field 6 was `proto_sources`, retired for the reason the library's was.
  // Field 8 was `web`, which named the `<title>` and the `lang` of the `.html`
  // a WEB output writes; a page names its own tab now, with `ui/web`'s `title`
  // on the page and `Document` on the worker. Neither number is reused.
  reserved 6, 8;
  reserved "proto_sources", "web";

  // Exactly the same meaning as on a library.
  repeated Generator generators = 7;

  repeated string dependencies = 2;

  // Exactly the same meaning as on a library: labels this target carries. A
  // binary has no `platforms` field: its `outputs` already say which platforms
  // it is built for.
  repeated string tags = 3;

  // What to produce. One artifact per output, and the whole graph is checked
  // once per output, because each one names a platform and an entry of its own.
  repeated Output outputs = 4;

  // Tests that exercise this binary through `main.buri`.
  TestSuite test = 5;
}

// A `tool` requires `tool.buri` in the package directory. Each block below
// declares the function of the same name that `tool.buri` exports, and the
// build calls it: a language's `check` and `format` on the files a rule
// references, and `generate` for a `generators` entry. A block without its
// function, or the function without its block, is an error.
//
// There is no `main`. The build writes the one that reads a request and writes
// the answer, and each entry point's `ctx` is bounded by `Allocator` and
// nothing else, so what a tool answers is a function of what it was handed.
//
// No `name` field, for the reason a library has none: `//tool/yaml` names it.
// Nothing depends on a tool and nothing imports its modules but its own tests,
// so it has no `visibility`.
message Tool {
  // Every .buri file in this package that belongs to the tool, excluding
  // `tool.buri` and the test sources.
  repeated string sources = 1;

  // Libraries the tool uses. The library in its own package needs no entry.
  repeated string dependencies = 2;

  // Tests of the tool. A test source imports `//tool/yaml/tool.buri`.
  TestSuite test = 3;

  // `tool.buri` exports `check`, a language's check.
  Check check = 4;

  // `tool.buri` exports `format`, a language's formatter.
  Format format = 5;

  // `tool.buri` exports `generate`, a generator.
  Generate generate = 6;
}

// `tool.buri` exports `check`. With `accepts`, it takes typed values.
message Check {
  repeated Accepts accepts = 1;
}

// Empty: a formatter lays out text, and a typed value has lost it.
message Format {}

// `tool.buri` exports `generate`. With `accepts`, each input is checked
// against the contract's `type_schema` and reaches `generate` typed.
message Generate {
  repeated Accepts accepts = 1;
}

// A contract: the inputs an entry point takes typed. Listing one hands the
// entry point values read through that language's `generate`; listing none
// hands it text.
//
// The build generates the language's types from `type_schema` into the tool as
// the module `<tool label>/<language>`, and the entry point takes
// `CheckRequest<Root>` or `GenerateRequest<Root>`, `Root` being its root type.
// An input in a language no entry lists is an error on the consumer's
// `inputs`.
message Accepts {
  // A language in REPO.buri with a `generate`, or a built-in one. One entry
  // per language, across `check` and `generate`.
  string language = 1;

  // Opaque here; the language's tools read it. For the JSON languages, a
  // JSON Schema relative to this package or a `//` path, in the repository.
  string type_schema = 2;
}

// A tool's `generate`, run by the build, whose answer becomes modules.
//
// The module a generator names `N` is importable as `<this package's label>/N`,
// so a generator naming `point.proto` in `//lib/wire` produces
// `//lib/wire/point.proto`.
message Generator {
  // Which tool to run: a `//label` naming a `tool` rule with a `generate {}`
  // block, or a built-in: `json`, `proto` or `textproto`. A binary is refused,
  // and so are the retired names `std/json`, `std/proto`, `std/textproto` and
  // `std/codegen/proto`.
  string tool = 1;

  // The files handed to the generator, package-relative, no globs. Their
  // contents are in the action key, so editing one re-runs the generator and
  // rebuilds whatever depended on what it produced.
  repeated string inputs = 2;
}

message Output {
  // A platform bundled with the toolchain, `"native"`, `"node"` or `"web"`,
  // or a label naming the repository's own, `"//platform/cloudflare_worker"`.
  // Every library in the transitive closure must admit it. An output of a
  // repository platform builds every entry it declares, each to a file named
  // after the entry, under `.buri/out/platform/<name>/`.
  string platform = 1;

  // One of the variants the platform's entries declare. Required when an entry
  // says `variant_required`. `native`'s are `linux-arm64`, `linux-x86_64`,
  // `macos-arm64` and `macos-x86_64`.
  string variant = 6;

  // The function filling one of the platform's entries, where it is not the
  // one named after the entry:
  // `entries: [{ name: "main", function: "mainForNode" }]`.
  //
  // One binary, several ways in. Each entry builds its own context and is the
  // root of its own dead-code elimination, so neither artifact holds what only
  // the other reaches.
  repeated Entry entries = 7;

  // Artifact filename. Defaults to the package's directory name (plus `.mjs`
  // for JavaScript).
  string artifact_name = 3;

  // Field 2 was `arch`, now the half of `variant` after the operating system.
  // Field 4 was `js`: every JavaScript output is an ES module. Field 5 was
  // `entry`, now `entries`. None of the numbers is reused.
  reserved 2, 4, 5;
  reserved "arch", "js", "entry";

  message Entry {
    // One of the platform's entries, as its `entry { name }` writes it.
    string name = 1;

    // The function in `main.buri` that fills it.
    string function = 2;
  }
}

// How a program is compiled. Closed: each backend is built into the CLI.
enum Backend {
  BACKEND_UNSPECIFIED = 0;
  // Machine code, linked into one executable.
  NATIVE = 1;
  // One ES module.
  JS = 2;
}

// A platform: the entries it offers, and how an output of it may be built.
// `native`, `node` and `web` are rules like this one, bundled with the
// toolchain. Its `platform.buri` declares the host type, each entry without a
// body, and the platform's own production structs. See `buri docs
// build/platforms`.
message Platform {
  // The rule's `.buri` files beside `platform.buri`.
  repeated string sources = 1;

  // The libraries `platform.buri` imports, such as the effect packages its
  // host offers. An output's platform is a dependency of its binary without
  // being listed there.
  repeated string dependencies = 2;

  // The entries outputs of this platform fill.
  repeated Entry entry = 4;

  // Files the platform adds to every output, copied beside its artifacts at
  // their own paths.
  repeated string assets = 5;

  // Field 3 was `variants`, now on each `entry`. The number is not reused.
  reserved 3;
  reserved "variants";

  message Entry {
    // The function an output fills it with, unless its `entries` says
    // otherwise.
    string name = 1;

    Backend backend = 2;

    // JS only: the adapter the host calls. The CLI bundles it with the
    // compiled entry, which it imports from `buri:program`. An export named
    // after one of the platform's production structs implements that
    // struct's bodiless methods, and every other export is the artifact's.
    // Without one, the entry starts itself, so it takes the program
    // signature, `fn(host: H): Result<(), Str>`.
    string js = 3;

    // Names an output picks between with `variant`. A variant changes how an
    // output is built, never what it may use. A `NATIVE` entry reads its
    // target from one, as `linux-arm64`, and builds the host's where there are
    // none.
    repeated string variants = 4;

    // An output must pick one of `variants`.
    bool variant_required = 5;
  }
}

// Tests live in the package's `test/` directory and are declared here. A test
// source imports the target under test by its label — `//lib/money` for a
// library, `//lib/money/main` for a binary — which is what confines a test to
// the target's public surface.
message TestSuite {
  // Package-relative paths, conventionally under `test/`.
  repeated string sources = 1;

  // Libraries available to the test sources in addition to the target's own
  // `dependencies`. Fakes, fixtures, golden-file helpers.
  repeated string dependencies = 2;

  // Field 3 was `data` — files the runner read from disk and handed the suite
  // as its in-memory filesystem. Retired: only a runner could hand a suite those
  // entries, so `data()` was empty in a linked test binary and the two backends
  // answered differently. A suite writes its own filesystem now, with
  // `fs().files([...])` from `platform/effect/testing`. The number is not reused.
  reserved 3;
  reserved "data";

  // Wall-clock ceiling per test declaration. Unset means the runner's built-in
  // default. There is no repository-wide setting: a suite that needs longer
  // says so where someone reading it will see it.
  uint32 timeout_seconds = 4;

  // Backends to run this suite on, one run each. Unset means one run, natively.
  // The suite inherits the target's tags either way.
  repeated Backend backends = 6;

  // Field 5 was `platforms`. A suite runs on a backend, and test
  // implementations are plain Buri, so one runs anywhere.
  reserved 5;
  reserved "platforms";
}
