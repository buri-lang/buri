# The runtime crate's unit tests, as a workspace member nextest can schedule.
#
# `cli/runtime` can't hold a `Cargo.toml` (its `manifest.toml` says why), so
# this package compiles the same `lib.rs` as an rlib. `[dependencies]` and
# `[features]` must match `manifest.toml` line for line, and `Cargo.lock` must
# pin what `manifest.lock` pins. `language::corpus::the_runtime_tests_build_the_shipped_runtime`
# checks both.
[package]
name = "buri-rt-tests"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
name = "buri_rt"
path = "../cli/runtime/lib.rs"
# The archive is a staticlib, and cargo never doctests one.
doctest = false

[dependencies]
tokio = { version = "1", optional = true, default-features = false, features = ["rt-multi-thread", "net", "time", "io-util", "sync"] }
hyper = { version = "1", optional = true, default-features = false, features = ["client", "server", "http1", "http2"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["std", "tls12", "ring"] }
ring = { version = "0.17", optional = true, default-features = false }
tungstenite = { version = "0.30", optional = true, default-features = false, features = ["handshake"] }
quinn = { version = "0.11", optional = true, default-features = false, features = ["rustls-ring", "runtime-tokio"] }
getrandom = { version = "0.4", optional = true, default-features = false }
taffy = { version = "=0.14.0", optional = true, default-features = false, features = ["std", "taffy_tree", "flexbox", "grid"] }
cosmic-text = { version = "=0.19.0", optional = true, default-features = false, features = ["std", "swash"] }
tiny-skia = { version = "=0.12.0", optional = true, default-features = false, features = ["std", "simd"] }

[features]
default = ["net", "crypto", "paint"]
net = ["dep:tokio", "dep:hyper", "dep:rustls", "dep:ring", "dep:tungstenite"]
net-h3 = ["net", "dep:quinn"]
crypto = ["dep:getrandom", "dep:ring", "ring/alloc"]
paint = ["dep:taffy", "dep:cosmic-text", "dep:tiny-skia"]

[lints]
workspace = true
